<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taste Lounge — Checkout</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css" />
  <link rel="shortcut icon"
    href="https://www.summahealth.org/-/media/project/summahealth/website/page-content/flourish/2_18a_fl_fastfood_400x400.webp?la=en&h=400&w=400&hash=145DC0CF6234A159261389F18A36742A"
    type="image/x-icon" />

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

  <style>
    :root {
      --red: #ff0000;
      --cream: #fff6e9;
      --white: #fff;
      --black: #1a1a1a;
      --muted: #777;
    }

    * {
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    /* Animation Keyframes */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .animate-fade-in {
      animation: fadeInUp 0.6s ease-out forwards;
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system;
      background: var(--cream);
      margin: 0;
      padding-bottom: 90px;
      color: var(--black);
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
      grid-template-columns: 1.2fr 1fr;
      align-items: start;
    }

    .card {
      background: var(--white);
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
      font-size: 18px;
      transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      opacity: 0;
      animation: fadeInUp 0.6s ease-out forwards;
    }

    .card:nth-child(1) {
      animation-delay: 0.1s;
    }

    .card:nth-child(2) {
      animation-delay: 0.2s;
    }

    .card:nth-child(3) {
      animation-delay: 0.3s;
    }

    .card:nth-child(4) {
      animation-delay: 0.4s;
    }

    body.dark .card {
      background: #1e1e1e;
      color: #fff;

      box-shadow: 0 12px 30px rgba(191, 179, 179, 0.215);
    }

    .card h2 {
      color: var(--red);
      margin-bottom: 14px;
      font-size: 22px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 15px;
    }

    .item span:last-child {
      font-weight: 600;
    }

    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 14px 0;
    }

    .card h3 {
      font-size: 22px;
      margin-top: 8px;
    }

    a {
      display: inline-block;
      margin-top: 10px;
      color: var(--red);
      text-decoration: none;
      font-weight: 600;
    }

    body.dark .card {
      background: #1e1e1e;
      color: #fff;

      box-shadow: 0 12px 30px rgba(191, 179, 179, 0.215);
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #ddd;
      margin-bottom: 12px;
      font-size: 15px;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    input:focus,
    textarea:focus {
      border-color: var(--red);
      outline: none;
      background: #fff5f5;
      box-shadow: 0 0 15px rgba(220, 20, 60, 0.2);
      transform: translateY(-2px);
    }

    .option {
      align-items: center;
      margin: 12px 0;
      font-size: 1.1rem;
    }

    .option input[type="radio"] {
      width: 18px;
      height: 18px;
      margin-right: 10px;
      cursor: pointer;
      transform: scale(0.8);
    }

    .option label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 1.1rem;
      color: #d61b1b;
      display: inline-block;
    }

    body.dark .option label {
      color: #fff;
    }

    .option:hover {
      border-color: var(--red);
    }

    .option input {
      transform: scale(1.2);
    }

    .option:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    .option.disabled-delivery {
      background: #f0f0f0;
      padding: 12px;
      border-radius: 8px;
      opacity: 0.6;
      cursor: not-allowed;
      pointer-events: none;
    }

    body.dark .option.disabled-delivery {
      background: #2a2a2a;
    }

    .delivery-free-badge {
      display: inline-block;
      background: #4caf50;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-left: 8px;
      font-weight: 600;
    }

    .pay-btn {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--red);
      color: white;
      padding: 18px;
      font-size: 18px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      z-index: 10;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 -4px 20px rgba(220, 20, 60, 0.3);
    }

    .pay-btn:hover {
      background-color: rgb(208, 35, 35);
      box-shadow: 0 -8px 30px rgba(220, 20, 60, 0.5);
      transform: translateY(-3px);
    }

    .pay-btn:active {
      transform: translateY(-1px);
    }

    @media (min-width: 900px) {
      body {
        padding-bottom: 40px;
      }

      .container {
        max-width: 900px;
        margin: auto;
        padding: 20px;
      }

      .card {
        margin-bottom: 20px;
      }

      .pay-btn {
        position: static;
        width: 100%;
        border-radius: 14px;
        margin-top: 15px;
      }

      .container {
        padding: 20px;
      }

      input,
      textarea {
        margin-bottom: 15px;
      }

      #summary,
      .option,
      .pay-btn {
        margin-bottom: 15px;
      }

      input,
      textarea {
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #ddd;
      }
    }

    @media (max-width: 480px) {
      .option {
        font-size: 1rem;
      }

      .option input[type="radio"] {
        width: 16px;
        height: 16px;
        margin-right: 8px;
        transform: scale(0.7);
      }

      .option label {
        font-size: 1rem;
      }
    }

    body.dark {
      background: #121212;
      color: #eee;
    }

    body.dark .header,
    body.dark .container,
    body.dark .cart-item {
      background: #1e1e1e;
      color: #fff;
    }

    body.dark {
      background: #121212;
      color: red;
    }

    [hidden] {
      display: none !important;
    }

    /* ---------- summary lines ---------- */
    .sum-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 8px 0;
      font-size: 16px;
    }

    .sum-row.discount {
      color: #2e7d32;
      font-weight: 600;
    }

    .sum-total {
      display: flex;
      justify-content: space-between;
      font-size: 22px;
      font-weight: 800;
      margin-top: 12px;
    }

    .earn-note {
      margin: 10px 0 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: #fff8e1;
      color: #7a5a00;
      font-size: 14px;
    }

    body.dark .earn-note {
      background: #3a3000;
      color: #ffe082;
    }

    /* ---------- promo code & points ---------- */
    .promo-row {
      display: flex;
      gap: 10px;
    }

    .promo-row input {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .small-btn {
      flex: none;
      border: 0;
      border-radius: 12px;
      padding: 0 20px;
      background: var(--black);
      color: #fff;
      font: 700 15px Inter, system-ui, sans-serif;
      cursor: pointer;
    }

    .small-btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    .small-btn:focus-visible,
    .chip-btn:focus-visible,
    .points-toggle input:focus-visible {
      outline: 3px solid #FBC02D;
      outline-offset: 2px;
    }

    .promo-msg {
      min-height: 20px;
      margin: 8px 0 0;
      font-size: 14px;
    }

    .promo-msg.error {
      color: #c62828;
    }

    .promo-applied {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px dashed #2e7d32;
      background: #e8f5e9;
      color: #1b5e20;
      font-size: 15px;
    }

    .promo-applied button {
      border: 0;
      background: none;
      color: #c62828;
      font-weight: 700;
      cursor: pointer;
    }

    .points-box {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #eee;
      font-size: 15px;
    }

    .points-toggle {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .points-toggle input {
      width: 22px;
      height: 22px;
      margin: 0;
      accent-color: var(--red);
      flex: none;
    }

    .muted-text {
      color: var(--muted);
      font-size: 14px;
    }

    /* ---------- saved addresses ---------- */
    .addr-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .chip-btn {
      flex: none;
      max-width: 220px;
      text-align: left;
      border: 1.5px solid #eee;
      border-radius: 12px;
      padding: 8px 12px;
      background: #fff;
      cursor: pointer;
      font: 500 13px Inter, system-ui, sans-serif;
      color: var(--black);
    }

    .chip-btn b {
      display: block;
      font-size: 14px;
    }

    .chip-btn span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
    }

    .chip-btn.on {
      border-color: var(--red);
      background: #fff5f5;
    }

    .save-addr {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    .save-addr input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--red);
    }

    body.dark .chip-btn {
      background: #2a2a2a;
      color: #eee;
      border-color: #444;
    }

    /* ---------- payment methods ---------- */
    .pay-methods {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .pay-methods span {
      padding: 6px 12px;
      border-radius: 999px;
      background: #f5f5f5;
      font-size: 14px;
    }

    body.dark .pay-methods span {
      background: #2a2a2a;
    }

    /* ---------- closed / paused ---------- */
    .closed-note {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 14px 16px;
      margin-bottom: 20px;
      border-radius: 14px;
      background: #1A1A1A;
      color: #fff;
      font-size: 15px;
      line-height: 1.45;
    }

    .closed-note b {
      display: block;
      color: #FBC02D;
    }

    .pay-btn:disabled {
      background: #9e9e9e;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
  </style>

<body>
  <div class="container">
    <div class="card">
      <h2>Order Summary</h2>
      <div id="summary"></div>
      <hr />
      <div class="sum-row"><span>Subtotal</span><span id="subtotal">₦0</span></div>
      <div class="sum-row discount" id="promoRow" hidden><span id="promoLabel">Promo</span><span id="promoAmount"></span></div>
      <div class="sum-row"><span>Delivery</span><span id="deliveryDisplay">…</span></div>
      <div class="sum-row discount" id="pointsRow" hidden><span id="pointsLabel">Points</span><span id="pointsAmount"></span></div>
      <div class="sum-total"><span>Total</span><span id="total">₦0</span></div>
      <p class="earn-note" id="earnNote" hidden></p>
      <a href="cart.html">← Back to Cart</a>
    </div>

    <!-- Promo codes come from Admin → Promo codes; points from Admin → Store Settings -->
    <div class="card">
      <h2>Promo code</h2>
      <form id="promoForm" class="promo-row" autocomplete="off">
        <input id="promoInput" placeholder="Enter promo code" maxlength="30" aria-label="Promo code" />
        <button type="submit" class="small-btn" id="promoBtn">Apply</button>
      </form>
      <div id="promoApplied" class="promo-applied" hidden></div>
      <p class="promo-msg" id="promoMsg" role="status"></p>

      <div class="points-box" id="pointsBox" hidden></div>
    </div>

    <div class="card">
      <h2>Delivery Option</h2>
      <div id="deliverySection">
        <!-- Fees come from Admin → Store Settings -->
        <div class="option" id="deliveryOption1">
          <input type="radio" name="delivery" id="standard" checked onclick="setDelivery('standard')" />
          <label for="standard">🚚 Standard (<span id="standardFee">…</span>)</label>
        </div>
        <div class="option" id="deliveryOption2">
          <input type="radio" name="delivery" id="express" onclick="setDelivery('express')" />
          <label for="express">⚡ Express (<span id="expressFee">…</span>)</label>
        </div>
        <div id="freeDeliveryMsg"
          style="display: none; margin-top: 10px; padding: 10px; background: #e8f5e9; border-radius: 8px; color: #2e7d32; font-weight: 600;">
          ✓ Free Delivery! Your order qualifies for free delivery (over ₦<span id="freeOver"></span>)
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Delivery Details</h2>
      <!-- Saved addresses from Profile → Saved Addresses -->
      <div class="addr-chips" id="addrChips" hidden></div>
      <input id="name" placeholder="Full name" autocomplete="name" />
      <input id="phone" placeholder="Phone number" autocomplete="tel" inputmode="tel" />
      <textarea id="address" placeholder="Delivery address" autocomplete="street-address"></textarea>
      <label class="save-addr" id="saveAddrRow" hidden>
        <input type="checkbox" id="saveAddr" checked /> Save this address for next time
      </label>
    </div>

    <div class="card">
      <h2>Payment Method</h2>
      <div class="option">
        <input type="radio" checked />
        <label>🔒 Paystack — secure checkout</label>
      </div>
      <div class="pay-methods" id="payMethods"></div>
    </div>

    <div class="closed-note" id="closedNote" role="status" hidden></div>

    <button class="pay-btn" id="placeOrderBtn" onclick="submitOrder()">Place Order</button>
  </div>
</body>

</html>

<script>
  if (localStorage.getItem("theme") === "on") {
    document.body.classList.add("dark");
  }

  firebase.initializeApp({
    apiKey: "AIzaSyAW3atuDYr7OeuT2b-Tn_ooD93ZfPqMA4g",
    authDomain: "taste-lounge-3075.firebaseapp.com",
    projectId: "taste-lounge-3075",
  });

  const db = firebase.firestore();
  const auth = firebase.auth();
  const $ = (id) => document.getElementById(id);

  // Paystack won't take a payment smaller than this, so discounts stop here.
  const MIN_PAYMENT = 100;

  const nameInput = $("name");
  const phoneInput = $("phone");
  const addressInput = $("address");

  const saved = (() => {
    try { return JSON.parse(localStorage.getItem("deliveryDraft")); } catch (e) { return null; }
  })();
  if (saved) {
    nameInput.value = saved.name || "";
    phoneInput.value = saved.phone || "";
    addressInput.value = saved.address || "";
  }

  [nameInput, phoneInput, addressInput].forEach((i) => {
    i.addEventListener("input", () => {
      localStorage.setItem("deliveryDraft", JSON.stringify({
        name: nameInput.value, phone: phoneInput.value, address: addressInput.value,
      }));
      renderAddressChips();
    });
  });

  const cart = (() => {
    try { return JSON.parse(localStorage.getItem("cart")) || []; } catch (e) { return []; }
  })();

  // Everything below comes from the admin panel (Store Settings, Promo codes)
  const store = { deliveryFee: 0, expressFee: 0, freeDeliveryOver: 0 };
  let settings = {};
  let storeLoaded = false;
  let storeStatus = { canOrder: true };
  let loyalty = tlLoyaltyConfig({});
  let deliveryChoice = "standard";

  let currentUser = null;
  let userData = {};
  let myOrders = [];
  let promo = null;       // the applied promo code document
  let usePoints = false;
  let placing = false;

  const naira = (n) => tlFormat(Math.round(Number(n) || 0));

  /* ---------------- store settings (live) ---------------- */
  db.collection("settings").doc("store").onSnapshot((snap) => {
    settings = snap.exists ? snap.data() : {};
    store.deliveryFee = Number(settings.deliveryFee) || 0;
    store.expressFee = Number(settings.expressFee) || 0;
    store.freeDeliveryOver = Number(settings.freeDeliveryOver) || 0;
    loyalty = tlLoyaltyConfig(settings);
    storeStatus = tlStoreStatus(settings);
    storeLoaded = true;

    $("standardFee").textContent = store.deliveryFee ? naira(store.deliveryFee) : "Free";
    $("expressFee").textContent = naira(store.expressFee);
    $("freeOver").textContent = store.freeDeliveryOver.toLocaleString();
    // hide Express if the admin hasn't set a price for it
    $("deliveryOption2").style.display = store.expressFee > 0 ? "" : "none";
    if (store.expressFee <= 0 && deliveryChoice === "express") deliveryChoice = "standard";

    renderPayMethods();
    renderSummary();
  }, (err) => {
    console.error("Could not load store settings:", err);
    storeLoaded = true;
    renderSummary();
  });
  setInterval(() => {
    if (storeLoaded) {
      storeStatus = tlStoreStatus(settings);
      renderClosed();
    }
  }, 60000);

  /* ---------------- the signed-in customer ---------------- */
  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      location.href = "log-in.html";
      return;
    }
    currentUser = user;
    try {
      const [userSnap, ordersSnap] = await Promise.all([
        db.collection("users").doc(user.uid).get(),
        db.collection("orders").where("userId", "==", user.uid).get(),
      ]);
      userData = userSnap.exists ? userSnap.data() : {};
      myOrders = ordersSnap.docs.map((d) => d.data());
    } catch (err) {
      console.error("Could not load your account:", err);
    }
    // No draft? Start from the default saved address.
    if (!saved) {
      const def = savedAddresses().find((a) => a.isDefault) || savedAddresses()[0];
      if (def) fillAddress(def);
      else if (userData.address) {
        nameInput.value = userData.name || userData.username || "";
        phoneInput.value = userData.phone || "";
        addressInput.value = userData.address || "";
      }
    }
    renderAddressChips();
    renderSummary();
  });

  /* ---------------- totals ---------------- */
  function computeTotals() {
    const subtotal = cart.reduce((s, i) => s + (Number(i.price) || 0) * (Number(i.quantity) || 0), 0);

    // promo code
    let promoDiscount = 0;
    let freeDeliveryByPromo = false;
    if (promo) {
      if (promo.type === "percent") {
        promoDiscount = Math.round((subtotal * (Number(promo.value) || 0)) / 100);
        if (Number(promo.maxDiscount) > 0) promoDiscount = Math.min(promoDiscount, Number(promo.maxDiscount));
      } else if (promo.type === "fixed") {
        promoDiscount = Number(promo.value) || 0;
      } else if (promo.type === "free_delivery") {
        freeDeliveryByPromo = true;
      }
    }

    // delivery
    const freeByAmount = store.freeDeliveryOver > 0 && subtotal > store.freeDeliveryOver;
    const deliveryFree = freeByAmount || freeDeliveryByPromo;
    const delivery = !storeLoaded || deliveryFree ? 0 : deliveryChoice === "express" ? store.expressFee : store.deliveryFee;

    // a discount can't make the order free (there'd be nothing to pay with Paystack)
    promoDiscount = Math.max(0, Math.min(promoDiscount, subtotal, subtotal + delivery - MIN_PAYMENT));

    // loyalty points
    const points = tlLoyaltyBalance(myOrders);
    let pointsUsed = 0;
    let pointsDiscount = 0;
    const beforePoints = subtotal - promoDiscount + delivery;
    const canUsePoints = loyalty.enabled && points.balance >= Math.max(1, loyalty.minRedeem);
    if (usePoints && canUsePoints) {
      const room = Math.max(0, beforePoints - MIN_PAYMENT);
      pointsUsed = Math.min(points.balance, Math.floor(room / loyalty.pointValue));
      pointsDiscount = pointsUsed * loyalty.pointValue;
    }

    const total = Math.max(0, beforePoints - pointsDiscount);
    // points are earned on the food, after discounts (not on delivery)
    const earned = tlPointsFor(subtotal - promoDiscount - pointsDiscount, loyalty);

    return {
      subtotal, promoDiscount, freeByAmount, freeDeliveryByPromo, deliveryFree, delivery,
      points, canUsePoints, pointsUsed, pointsDiscount, total, earned,
    };
  }

  function renderSummary() {
    const summary = $("summary");
    summary.innerHTML = cart.map((item) => `
      <div class="item">
        <span>${tlEsc(item.name)} x${Number(item.quantity) || 0}</span>
        <span>${naira((Number(item.price) || 0) * (Number(item.quantity) || 0))}</span>
      </div>`).join("") || `<p class="muted-text">Your cart is empty.</p>`;

    const t = computeTotals();
    $("subtotal").textContent = naira(t.subtotal);

    // promo line
    $("promoRow").hidden = !promo || (t.promoDiscount === 0 && !t.freeDeliveryByPromo);
    if (promo) {
      $("promoLabel").textContent = `Promo (${promo.code})`;
      $("promoAmount").textContent = t.freeDeliveryByPromo && !t.promoDiscount ? "Free delivery" : "−" + naira(t.promoDiscount);
    }

    // delivery line + options
    if (!storeLoaded) {
      $("deliveryDisplay").textContent = "…";
    } else if (t.deliveryFree) {
      $("deliveryDisplay").innerHTML = '<span style="color:#4caf50;font-weight:600;">FREE</span>';
      toggleDeliveryOptions(false, t.freeByAmount);
    } else {
      toggleDeliveryOptions(true, false);
      $("deliveryDisplay").textContent = t.delivery ? naira(t.delivery) : "FREE";
    }

    // points line
    $("pointsRow").hidden = !t.pointsDiscount;
    $("pointsLabel").textContent = `Points (${t.pointsUsed.toLocaleString()})`;
    $("pointsAmount").textContent = "−" + naira(t.pointsDiscount);

    $("total").textContent = naira(t.total);
    localStorage.setItem("cartTotal", t.total);

    $("earnNote").hidden = !(loyalty.enabled && t.earned > 0);
    $("earnNote").textContent = `⭐ You'll earn ${t.earned.toLocaleString()} points with this order (added once it's delivered).`;

    renderPoints(t);
    renderClosed();
  }

  function toggleDeliveryOptions(enabled, showFreeMsg) {
    document.querySelectorAll("#deliverySection .option").forEach((option) => {
      option.classList.toggle("disabled-delivery", !enabled);
      option.querySelectorAll("input").forEach((input) => (input.disabled = !enabled));
    });
    $("freeDeliveryMsg").style.display = showFreeMsg ? "block" : "none";
    if (!enabled) $("standard").checked = true;
  }

  function setDelivery(choice) {
    deliveryChoice = choice;
    renderSummary();
  }

  /* ---------------- promo codes ---------------- */
  function promoMessage(text, isError) {
    $("promoMsg").textContent = text;
    $("promoMsg").className = "promo-msg" + (isError ? " error" : "");
  }

  // Returns an error message, or "" when the code can be used on this cart.
  function promoProblem(p, subtotal) {
    const now = Date.now();
    const ms = (ts) => (ts && ts.toMillis ? ts.toMillis() : 0);
    if (!p || p.active === false) return "That code isn't valid.";
    if (ms(p.startsAt) && ms(p.startsAt) > now) return "That code isn't active yet.";
    if (ms(p.expiresAt) && ms(p.expiresAt) < now) return "That code has expired.";
    if (Number(p.usageLimit) > 0 && (Number(p.usedCount) || 0) >= Number(p.usageLimit)) return "That code has been fully used.";
    if (Number(p.minOrder) > 0 && subtotal < Number(p.minOrder)) return `Spend ${naira(p.minOrder)} or more on food to use this code.`;
    if (p.oncePerCustomer && myOrders.some((o) => o.promo && o.promo.code === p.code && (o.status && o.status.current) !== "cancelled")) {
      return "You've already used this code.";
    }
    return "";
  }

  async function fetchPromo(code) {
    const snap = await db.collection("promos").doc(code).get();
    return snap.exists ? { ...snap.data(), code: snap.id } : null;
  }

  $("promoForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const code = $("promoInput").value.trim().toUpperCase().replace(/\s+/g, "");
    if (!code) return promoMessage("Type a promo code first.", true);
    $("promoBtn").disabled = true;
    promoMessage("Checking…");
    try {
      const p = await fetchPromo(code);
      const problem = promoProblem(p, computeTotals().subtotal);
      if (problem) {
        promoMessage(problem, true);
        return;
      }
      promo = p;
      promoMessage("");
      renderPromo();
      renderSummary();
    } catch (err) {
      console.error("Promo lookup failed:", err);
      promoMessage("Couldn't check that code. Please try again.", true);
    } finally {
      $("promoBtn").disabled = false;
    }
  });

  function renderPromo() {
    $("promoForm").hidden = !!promo;
    $("promoApplied").hidden = !promo;
    if (!promo) return;
    const what = promo.type === "percent" ? `${promo.value}% off`
      : promo.type === "fixed" ? `${naira(promo.value)} off`
      : "Free delivery";
    $("promoApplied").innerHTML = `
      <span>✓ <b>${tlEsc(promo.code)}</b> — ${tlEsc(promo.description || what)}</span>
      <button type="button" id="removePromo">Remove</button>`;
    $("removePromo").onclick = () => {
      promo = null;
      $("promoInput").value = "";
      renderPromo();
      renderSummary();
      $("promoInput").focus();
    };
  }

  /* ---------------- loyalty points ---------------- */
  function renderPoints(t) {
    const box = $("pointsBox");
    if (!loyalty.enabled || !currentUser) {
      box.hidden = true;
      return;
    }
    box.hidden = false;
    const worth = naira(t.points.balance * loyalty.pointValue);
    if (t.canUsePoints) {
      box.innerHTML = `
        <label class="points-toggle">
          <input type="checkbox" id="usePoints" ${usePoints ? "checked" : ""}>
          <span><b>Use my points</b><br><span class="muted-text">You have ${t.points.balance.toLocaleString()} points (worth ${worth})</span></span>
        </label>`;
      $("usePoints").onchange = (e) => {
        usePoints = e.target.checked;
        renderSummary();
      };
    } else {
      const need = Math.max(1, loyalty.minRedeem);
      box.innerHTML = `<span class="muted-text">⭐ You have ${t.points.balance.toLocaleString()} points${t.points.pending ? ` (+${t.points.pending.toLocaleString()} on the way)` : ""}. ${t.points.balance < need ? `You can use them once you have ${need.toLocaleString()}.` : ""}</span>`;
    }
  }

  /* ---------------- saved addresses ---------------- */
  function savedAddresses() {
    return Array.isArray(userData.addresses) ? userData.addresses.filter((a) => a && a.address) : [];
  }

  const sameAddress = (a) => a.address.trim().toLowerCase() === addressInput.value.trim().toLowerCase();

  function fillAddress(a) {
    nameInput.value = a.name || nameInput.value;
    phoneInput.value = a.phone || phoneInput.value;
    addressInput.value = a.address || "";
    localStorage.setItem("deliveryDraft", JSON.stringify({
      name: nameInput.value, phone: phoneInput.value, address: addressInput.value,
    }));
  }

  function renderAddressChips() {
    const list = savedAddresses();
    const box = $("addrChips");
    box.hidden = !list.length;
    box.innerHTML = list.map((a, i) => `
      <button type="button" class="chip-btn ${sameAddress(a) ? "on" : ""}" data-addr="${i}">
        <b>${a.isDefault ? "★ " : ""}${tlEsc(a.label || "Address")}</b><span>${tlEsc(a.address)}</span>
      </button>`).join("");
    const isNew = currentUser && addressInput.value.trim() && !list.some(sameAddress);
    $("saveAddrRow").hidden = !isNew;
  }

  $("addrChips").addEventListener("click", (e) => {
    const chip = e.target.closest("[data-addr]");
    if (!chip) return;
    fillAddress(savedAddresses()[Number(chip.dataset.addr)]);
    renderAddressChips();
  });

  /* ---------------- payment methods & closed notice ---------------- */
  function renderPayMethods() {
    const channels = tlPaymentChannels(settings);
    $("payMethods").innerHTML = channels.map((c) =>
      `<span>${TL_PAYMENT_CHANNELS[c].icon} ${tlEsc(TL_PAYMENT_CHANNELS[c].label)}</span>`).join("");
  }

  function renderClosed() {
    const note = $("closedNote");
    const blocked = storeLoaded && !storeStatus.canOrder;
    note.hidden = !blocked;
    $("placeOrderBtn").disabled = blocked || placing;
    if (blocked) {
      note.innerHTML = `<span aria-hidden="true">🕘</span><div><b>${storeStatus.paused ? "Orders are paused" : "We're closed right now"}</b>${tlEsc(storeStatus.paused ? storeStatus.message : storeStatus.nextOpen || "Please check back later.")} Your cart is saved.</div>`;
    }
  }

  /* ---------------- place order ---------------- */
  async function submitOrder() {
    if (placing) return;
    if (!cart.length) return alert("Cart is empty");
    if (!storeLoaded) return alert("Still loading delivery prices — please try again in a moment.");
    storeStatus = tlStoreStatus(settings);
    if (!storeStatus.canOrder) {
      renderClosed();
      return alert(storeStatus.message);
    }
    if (!nameInput.value.trim() || !phoneInput.value.trim() || !addressInput.value.trim()) {
      return alert("Please fill all details");
    }
    const user = auth.currentUser;
    if (!user) return alert("Please login again");

    placing = true;
    renderClosed();
    try {
      // check the promo code again in case it expired or ran out meanwhile
      if (promo) {
        const fresh = await fetchPromo(promo.code);
        const problem = promoProblem(fresh, computeTotals().subtotal);
        if (problem) {
          promo = null;
          renderPromo();
          renderSummary();
          promoMessage(problem + " It has been removed.", true);
          throw new Error("promo");
        }
        promo = fresh;
      }

      const t = computeTotals();
      const delivery = {
        name: nameInput.value.trim(),
        phone: phoneInput.value.trim(),
        address: addressInput.value.trim(),
      };

      const profile = {
        name: delivery.name,
        phone: delivery.phone,
        address: delivery.address,
        email: user.email,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      };
      // remember a new address (Profile → Saved Addresses)
      const list = savedAddresses();
      if (!$("saveAddrRow").hidden && $("saveAddr").checked && !list.some(sameAddress)) {
        profile.addresses = [...list, {
          id: "a" + Date.now().toString(36),
          label: list.length ? "Address " + (list.length + 1) : "Home",
          ...delivery,
          isDefault: list.length === 0,
        }];
      }
      await db.collection("users").doc(user.uid).set(profile, { merge: true });

      localStorage.setItem("pendingOrder", JSON.stringify({
        items: cart,
        pricing: {
          subtotal: t.subtotal,
          discount: t.promoDiscount,
          delivery: t.delivery,
          pointsDiscount: t.pointsDiscount,
          total: t.total,
        },
        delivery,
        deliveryType: deliveryChoice,
        promo: promo ? {
          code: promo.code,
          type: promo.type,
          value: Number(promo.value) || 0,
          discount: t.promoDiscount,
          freeDelivery: t.freeDeliveryByPromo,
        } : null,
        loyalty: loyalty.enabled ? { earned: t.earned, redeemed: t.pointsUsed, pointValue: loyalty.pointValue } : null,
      }));
      localStorage.setItem("cartTotal", t.total);

      window.location.href = "taste-lounge-paystack.html";
    } catch (err) {
      if (err.message !== "promo") {
        console.error("Checkout failed:", err);
        alert("Something went wrong. Please try again.");
      }
      placing = false;
      renderClosed();
    }
  }

  renderSummary();
</script>
