<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ff0000" />
  <title>You're offline | Taste Lounge</title>
  <link rel="icon" href="/icons/favicon-32.png" />
  <style>
    :root { --red: #ff0000; --cream: #FFF6E9; --black: #1A1A1A; --yellow: #FBC02D; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--cream); color: var(--black);
      font-family: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    .box { max-width: 360px; }
    img { width: 140px; height: auto; }
    h1 { font-size: 1.6rem; margin: 12px 0 8px; }
    p { color: #555; line-height: 1.5; margin: 0 0 24px; }
    button {
      border: 0; border-radius: 999px; padding: 14px 28px; font: 600 1rem inherit;
      background: var(--red); color: #fff; cursor: pointer; box-shadow: 0 8px 20px rgba(255, 0, 0, .25);
    }
    button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/taste-lounge-logo.png" alt="Taste Lounge" />
    <h1>You're offline</h1>
    <p>We can't reach the kitchen right now. Check your internet connection, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
