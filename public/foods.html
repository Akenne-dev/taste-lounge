<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Taste Lounge — Foods</title>

  <link rel="shortcut icon"
    href="https://www.summahealth.org/-/media/project/summahealth/website/page-content/flourish/2_18a_fl_fastfood_400x400.webp?la=en&h=400&w=400&hash=145DC0CF6234A159261389F18A36742A"
    type="image/x-icon">
  <script src="https://kit.fontawesome.com/a81368914c.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="auto-logout.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="menu-service.js"></script>
  <script src="store-hours.js"></script>



  <style>
    :root {
      --yellow: #FBC02D;
      --red: #ff0000;
      --cream: #FFF6E9;
      --black: #1A1A1A;
      --white: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Inter, Poppins, system-ui, Arial;
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
      padding-top: 100px;
    }

    
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 90px;
      z-index: 3000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
    }

    @media (max-width: 768px) {
      .header {
        padding: 0 16px;
      }
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      color: var(--red);
    }

    
    .desktop-nav {
      display: flex;
      gap: 60px;
    }

    .desktop-nav a {
      font-size: 18px;
      font-weight: 600;
      color: var(--black);
      text-decoration: none;
      position: relative;
    }

    .desktop-nav a:hover,
    .desktop-nav a.active {
      color: var(--red);
    }

    .desktop-nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 100%;
      height: 3px;
      background: var(--red);
      border-radius: 8px;
    }

    
    .hamburger {
      font-size: 32px;
      cursor: pointer;
      color: var(--red);
      display: none;
    }

    
    .mobile-menu {
      position: fixed;
      top: 0;
      left: -100%;
      width: 260px;
      height: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      padding: 25px;
      z-index: 4000;
      transition: .3s ease;
    }

    .mobile-menu .close-btn {
      font-size: 35px;
      cursor: pointer;
      color: var(--red);
      margin-bottom: 20px;
    }

    .mobile-menu a {
      display: block;
      font-size: 19px;
      padding: 10px 0;
      font-weight: 600;
      color: var(--black);
    }
        body.dark .mobile-menu a  {
      color: white !important;

    }

    .mobile-menu a:hover {
      color: var(--red);
    }

    
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: var(--white);
      box-shadow: 0 -4px 14px rgba(0, 0, 0, 0.07);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 3000;
    }

    .bottom-nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 12px;
      color: var(--black);
      text-decoration: none;
    }

    .bottom-nav i {
      font-size: 20px;
      margin-bottom: 3px;
    }

    .bottom-nav a.active-bottom {
      color: red;
    }

    
    .search-section {
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
          body.dark ::placeholder{
      color: #9c9595 !important;
      
    }

    .search-input {
      width: 70%;
      padding: 12px 18px;
      border-radius: 29px;
      border: 1px solid red;
      font-size: 16px;
      background-color: transparent;

    }
        body.dark .search-input{
      color: white !important;
      
    }

    
    .search-input:focus {
      border: 2px solid red !important;
      outline: none;
      background-color: rgba(255, 0, 0, 0.06);
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      overflow-x: auto;
    }

    .filters button {
      padding: 8px 14px;
      border-radius: 20px;
      border: none;
      background: var(--red);
      color: white;
      font-size: 14px;
    }

    
    .deals-carousel {
      margin: 25px 0;
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      gap: 15px;
    }

    /* JS sets --slide-to and the duration from the number of deals */
    .carousel-track.is-sliding {
      animation: slide var(--slide-time, 30s) linear infinite;
    }

    .deal-card {
      min-width: 80%;
      padding: 18px;
      background: linear-gradient(120deg, var(--red), #ff5252);
      color: white;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 700;
    }

    @keyframes slide {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(var(--slide-to, -300%));
      }
    }

    
    .category-scroll h2 {
      margin-bottom: 10px;
      color: var(--red);
    }

    .cat-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      justify-content: space-evenly;
      scrollbar-width: none;
    }

    .cat-box {
      white-space: nowrap;
      padding: 10px 18px;
      border-radius: 20px;
      background: var(--white);
      border: 2px solid red;
      font-weight: 600;
    }

    body.dark .cat-box {
      color: white !important;
      background-color: #121212;
    }
        body.dark .cat-box:hover {
      background: #fff;
      color: red !important;
    }

    .cat-box:hover {
      background: red;
      color: #fff;
      transform: translateY(-2px);
    }

    .view-btn:active {
      transform: scale(0.96);
    }

    
    .trending-section h2 {
      margin: 18px 0;
      color: var(--red);
    }

    .trending-track {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      scrollbar-width: none;

    }

    .trend-card {
      min-width: 180px;
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.110);
      font-weight: bold;
    }

    body.dark .trend-card {
      color: white !important;
      background-color: #2b2a2ad9;
      box-shadow: 0 0 15px rgba(238, 196, 196, 0.11);

    }

    .trend-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
    }

    .trend-card button {
      width: 100%;
      background: var(--red);
      color: white;
      padding: 6px;
      border-radius: 8px;
      border: none;
      margin-top: 8px;
    }

    
    .popular-section h2 {
      margin: 20px 0 10px;
      color: var(--red);
    }

    .popular-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
    }

    .food-card {
      background: #fff;
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.120);
      text-align: center;
    }

    body.dark .food-card {
      color: white !important;
      background-color: #2b2a2ad9;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.475);

    }

    .food-card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 10px;
    }

    .food-card button {
      background: var(--red);
      color: white;
      padding: 8px 14px;
      border-radius: 10px;
      border: none;
      margin-top: 6px;
    }



    
    @media (max-width:900px) {
      .desktop-nav {
        display: none;
      }

      .hamburger {
        display: block;
      }

      .bottom-nav {
        display: flex;
      }

      body {
        padding-top: 80px;
        padding-bottom: 85px;
      }
    }

    @media (min-width:901px) {
      .mobile-menu {
        display: none;
      }

      .bottom-nav {
        display: none;
      }
    }

    
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px;
    }

    .hero-card {
      background: var(--white);
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    }

    .hero-card h1 {
      font-size: 34px;
      color: var(--red);
      margin-bottom: 10px;
    }

    .trend-card,
    .food-card,
    .cat-box {
      transition: opacity 0.3s ease;
    }


    
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 9;
    }

    
    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 820px;
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      z-index: 10;
      max-height: 80%;
      overflow-y: auto;
    }
    body.dark .modal {
      color: black !important;
            background: black;

    }

    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
        body.dark .modal-header {
      color: white !important;

    }

    .cancel {
      background: #ff0000 !important;
      border: none;
      font-size: 24px;
      cursor: pointer;
      padding: 5px 10px !important;
      width: 15% !important;

    }

    
    .meal-card {
      display: flex;
      gap: 15px;
      background: #f9f9f9;
      padding: 15px;
      border-radius: 14px;
      margin-bottom: 15px;
    }
            body.dark .meal-card {
      background: #1a1919;
            

    }

    .meal-card img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 12px;
    }

    .meal-info h4 {
      margin: 0;
      font-size: 18px;
    }
                body.dark .meal-card {
      color: white;
    }

    .meal-info p {
      margin: 6px 0;
      color: #444;
    }
                    body.dark .meal-info p {
      color: white;
    }

    .add-btn {
      padding: 8px 14px;
      border: none;
      background: #ff5c5c;
      color: #fff;
      border-radius: 10px;
      cursor: pointer;
    }


    

    .qty-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0px;
    }

    .qty-box button {
      width: 28px;
      height: 28px;
      border: none;
      background: red;
      color: white;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
    }

    .qty-box span.qty {
      font-size: 18px;
      font-weight: 600;
    }


    
    
    .qty-boxx {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      padding: 6px 10px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: fit-content;
      margin: 8px 70px !important;

    }

    .qty-btn {
      background: #ff5c5c;
      color: white;
      border: none;
      border-radius: 8px;
      width: 32px;
      height: 32px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .qty {
      font-size: 16px;
      font-weight: 600;
      text-align: center;

    }





    
    @media (max-width: 600px) {
      .meal-card {
        flex-direction: column;
        text-align: center;
      }

      .meal-card img {
        width: 100%;
        height: 170px;
      }

      .add-btn {
        padding: 8px 14px;
        border: none;
        background: #ff5c5c;
        color: #fff;
        border-radius: 10px;
        cursor: pointer;
        width: 40% !important;
      }

      .qty-box {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 8px 99px;
      }

    }

    @media (max-width: 1200px) {

      .qty-boxx {
        display: none;
      }
    }

    .search-results {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
      padding: 15px;
    }

    /* ---------- open / closed banner (Admin → Store Settings) ---------- */
    .store-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 900px;
      margin: 0 auto 18px;
      padding: 12px 16px;
      border-radius: 14px;
      background: #1A1A1A;
      color: #fff;
      font-size: 14px;
      line-height: 1.4;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .12);
    }

    .store-banner[hidden] {
      display: none;
    }

    .store-banner .sb-icon {
      flex: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--yellow);
      color: #1A1A1A;
      font-size: 16px;
    }

    .store-banner b {
      display: block;
      color: var(--yellow);
    }

    /* ---------- menu filters ---------- */
    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 15px 6px;
      margin: -12px auto 12px;
      max-width: 900px;
      scrollbar-width: none;
      justify-content: safe center;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-bar[hidden] {
      display: none;
    }

    .f-chip,
    .f-select {
      flex: none;
      height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1.5px solid #e6d6bf;
      background: #fff;
      color: #1A1A1A;
      font: 500 14px Poppins, sans-serif;
      cursor: pointer;
      transition: background .2s, border-color .2s, color .2s;
    }

    .f-select {
      padding-right: 10px;
    }

    .f-chip:hover,
    .f-select:hover {
      border-color: var(--red);
    }

    .f-chip[aria-pressed="true"],
    .f-select.is-set {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    .f-chip:focus-visible,
    .f-select:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 2px;
    }

    .results-info {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #555;
    }

    .results-info[hidden] {
      display: none;
    }

    .results-info button {
      border: 0;
      background: none;
      color: var(--red);
      font: 600 14px Poppins, sans-serif;
      cursor: pointer;
      padding: 6px 0;
    }

    body.dark .f-chip:not([aria-pressed="true"]),
    body.dark .f-select:not(.is-set) {
      background: #1e1e1e;
      color: #eee;
      border-color: #444;
    }

    body.dark .results-info {
      color: #bbb;
    }

    mark {
      background: yellow;
      padding: 0 3px;
    }

    body.dark {
      background: #121212;
      color: #eee;
    }

    body.dark .header,
    body.dark .container,
    body.dark .cart-item {
      background: #1e1e1e;
      color: #fff;
    }

    

    body.dark {
      background: #121212;
      color: red;
    }

    
    

    
    body.dark .header {
      background: #1a1a1a;
      box-shadow: none;
      border-bottom: 3px solid rgb(86, 82, 82);
    }

    
    body.dark .desktop-nav a {
      color: white !important;
    }

    body.dark .desktop-nav a.active {
      color: red !important;
    }


    
    body.dark .mobile-menu {
      background: rgba(26, 26, 26, 0.95);
      color: white;
    }

    
    body.dark .bottom-nav {
      background: #1a1a1a;
      border-top: 3px solid rgb(86, 82, 82) !important;

    }

    body.dark .bottom-nav a,
    body.dark .bottom-nav i {
      color: white !important;

    }

    body.dark .bottom-nav a.active-bottom,
    body.dark .bottom-nav a.active-bottom i {
      color: red !important;
    }

    body.dark .bottom-nav a.active-bottom:hover,
    body.dark .bottom-nav a.active-bottom:hover i {
      color: darkred !important;
    }

    body.dark #hove {
      color: white !important;
    }
        body.dark .no-match {
      color: white !important;
    }

    /* ---------- Clickable food cards → food-details.html ---------- */
    [data-food-id] {
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease, opacity .3s ease;
    }

    .trend-card[data-food-id]:hover,
    .food-card[data-food-id]:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.16);
    }

    .meal-card[data-food-id]:hover {
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12);
    }

    [data-food-id]:focus-visible {
      outline: 3px solid rgba(255, 0, 0, 0.45);
      outline-offset: 3px;
    }

    [data-food-id] img {
      transition: transform .5s ease;
    }

    .trend-card[data-food-id]:hover img,
    .food-card[data-food-id]:hover img {
      transform: scale(1.04);
    }

    .view-details {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--red);
      margin-top: 4px;
    }

    .view-details i {
      font-size: 10px;
      transition: transform .2s ease;
    }

    [data-food-id]:hover .view-details i {
      transform: translateX(3px);
    }

    [data-add] {
      cursor: pointer;
    }

    /* loading placeholders while the menu loads from Firestore */
    .skeleton-box {
      border-color: transparent !important;
      color: transparent !important;
      background: linear-gradient(90deg, #f1ece6 25%, #faf7f3 37%, #f1ece6 63%) !important;
      background-size: 400% 100% !important;
      animation: menuShimmer 1.4s ease infinite;
      box-shadow: none !important;
      pointer-events: none;
    }

    body.dark .skeleton-box {
      background: linear-gradient(90deg, #232020 25%, #2d2929 37%, #232020 63%) !important;
      background-size: 400% 100% !important;
    }

    @keyframes menuShimmer {
      0% { background-position: 100% 50%; }
      100% { background-position: 0 50%; }
    }

    /* rating badge on cards (from customer reviews) */
    .tl-rating {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin: 2px 0;
      font-size: 13px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .tl-rating > span:first-child {
      color: var(--yellow);
    }

    .tl-rating-count {
      font-weight: 500;
      color: #777;
    }

    body.dark .tl-rating {
      color: #fff;
    }

    body.dark .tl-rating-count {
      color: #bbb;
    }

    .sold-out {
      opacity: .55;
    }

    .modal-empty {
      text-align: center;
      padding: 30px 10px;
      color: #777;
    }
  </style>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ff0000">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Taste Lounge">
  <script src="pwa.js" defer></script>
</head>

<body data-install-banner>


  <header class="header">
    <div class="logo">Foods</div>

    
    <nav class="desktop-nav">
      <a href="foods.html" class="active">Foods</a>
      <a href="cart.html">Cart</a>
      <a href="orders.html">Orders</a>
      <a href="profile.html">Profile</a>
    </nav>

    
    <div class="hamburger" id="menuBtn">&#9776;</div>
  </header>

  
  <div class="mobile-menu" id="mobileMenu">
    <div class="close-btn" id="closeMenu">×</div>
    <a href="foods.html">Foods</a>
    <a href="cart.html">Cart</a>
    <a href="orders.html">Orders</a>
    <a href="profile.html">Profile</a>
  </div>

  
  
  <!-- Opening hours / "pause orders" come from Admin → Store Settings -->
  <div class="store-banner" id="storeBanner" role="status" hidden>
    <span class="sb-icon" aria-hidden="true"><i class="fa-solid fa-clock"></i></span>
    <div><b id="storeBannerTitle"></b><span id="storeBannerText"></span></div>
  </div>

  <section class="search-section">
    <input type="text" placeholder="What are you craving?" class="search-input" id="search" oninput="seek()">

  </section>

  <!-- Filters are built from the menu itself (only filters that match some dishes are shown) -->
  <div class="filter-bar" id="filterBar" role="group" aria-label="Filter the menu" hidden></div>
  <div class="results-info" id="resultsInfo" hidden>
    <span id="resultsCount"></span>
    <button type="button" id="clearFilters">Clear filters</button>
  </div>
  <section class="search-results" id="results"></section>




  
  <!-- Deals come from Admin → Store Settings -->
  <section class="deals-carousel" id="dealsSection" hidden>
    <div class="carousel-track" id="dealsTrack"></div>
  </section>

  <p id="noResults" class="no-match"
    style="display:none; text-align:center; margin-top:10px; font-size: 18px; color: red;">
    No matched meals found
  </p>


  
  <section class="category-scroll">
    <h2>Categories</h2>

    <!-- Categories come from Admin → Categories -->
    <div class="cat-container" id="catContainer">
      <div class="cat-box skeleton-box" style="width:150px">&nbsp;</div>
      <div class="cat-box skeleton-box" style="width:120px">&nbsp;</div>
      <div class="cat-box skeleton-box" style="width:140px">&nbsp;</div>
    </div>

  </section>

  <p id="menuError" class="no-match" style="display:none; text-align:center; margin:20px; font-size:16px; color:red;"></p>

  <!-- Trending / Popular dishes are ticked in Admin → Foods -->
  <section class="trending-section" id="trendingSection">
    <h2></h2>
    <div class="trending-track" id="trendingTrack">
      <div class="trend-card skeleton-box" style="height:250px"></div>
      <div class="trend-card skeleton-box" style="height:250px"></div>
      <div class="trend-card skeleton-box" style="height:250px"></div>
    </div>
  </section>

  <section class="popular-section" id="popularSection">
    <h2>Popular This Week ⭐</h2>
    <div class="popular-grid" id="popularGrid">
      <div class="food-card skeleton-box" style="height:260px"></div>
      <div class="food-card skeleton-box" style="height:260px"></div>
      <div class="food-card skeleton-box" style="height:260px"></div>
    </div>
  </section>


    
    <nav class="bottom-nav">
      <a href="foods.html" class="active-bottom"><i class="fa fa-utensils"></i><span>Foods</span></a>
      <a href="cart.html"><i class="fa fa-shopping-cart"></i><span>Cart</span></a>
      <a href="orders.html"><i class="fa fa-receipt"></i><span>Orders</span></a>
      <a href="profile.html"><i class="fa fa-user"></i><span>Profile</span></a>
    </nav>


    <div class="modal-backdrop" id="naijaBackdrop"></div>

    <div class="modal" id="naijaModal">
      <div class="modal-header">
        <h2 id="modalTitle">Foods</h2>
        <button class="cancel" onclick="closeNaija()">×</button>
      </div>

      <div class="modal-body" id="naijaList"></div>
    </div>



</body>

</html>


<script>
  if (localStorage.getItem("theme") === "on") {
    document.body.classList.add("dark");
  }

  
  const firebaseConfig = {
    apiKey: "AIzaSyAW3atuDYr7OeuT2b-Tn_ooD93ZfPqMA4g",
    authDomain: "taste-lounge-3075.firebaseapp.com",
    projectId: "taste-lounge-3075",
    storageBucket: "taste-lounge-3075.firebasestorage.app",
    messagingSenderId: "923805907944",
    appId: "1:923805907944:web:8c054c78c5cbd75929c25d"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  
  auth.onAuthStateChanged(user => {
    if (!user) location.href = "log-in.html";
  });

  
  const menuBtn = document.getElementById("menuBtn");
  const closeMenu = document.getElementById("closeMenu");
  const mobileMenu = document.getElementById("mobileMenu");
  menuBtn.onclick = () => mobileMenu.style.left = "0";
  closeMenu.onclick = () => mobileMenu.style.left = "-100%";


  

  /* ================= Menu (loaded from Firestore) =================
     Everything here is managed in the admin panel: dishes, categories,
     extras, deals and delivery settings. See menu-service.js. */

  let menu = null; // { foods, categories, settings, findFood, foodsIn }

  function cardAttrs(food) {
    return `data-food-id="${tlEsc(food.id)}" tabindex="0" role="link" aria-label="View details for ${tlEsc(food.name)}"`;
  }

  function addButton(food, className = "") {
    return `<button type="button" class="${className}" data-add="${tlEsc(food.id)}"
      aria-label="Add ${tlEsc(food.name)} to cart">Add to Cart</button>`;
  }

  function foodImg(food) {
    return `<img src="${tlEsc(food.img || "taste-lounge-logo.png")}" alt="${tlEsc(food.name)}" loading="lazy" onerror="${TL_IMG_FALLBACK}">`;
  }

  function renderDeals(deals) {
    const section = document.getElementById("dealsSection");
    const track = document.getElementById("dealsTrack");
    section.hidden = deals.length === 0;
    track.innerHTML = deals.map(text => `<div class="deal-card">${tlEsc(text)}</div>`).join("");
    track.classList.toggle("is-sliding", deals.length > 1);
    // slide until the last deal is in view, ~7.5s per deal
    track.style.setProperty("--slide-to", `calc(${deals.length - 1} * (-80% - 15px))`);
    track.style.setProperty("--slide-time", `${Math.max(10, deals.length * 7.5)}s`);
  }

  function renderCategories(categories) {
    const box = document.getElementById("catContainer");
    if (!categories.length) {
      box.innerHTML = `<p class="modal-empty">No categories yet.</p>`;
      return;
    }
    box.innerHTML = categories.map(c => `
      <div class="cat-box" role="button" tabindex="0" data-category="${tlEsc(c.id)}">${tlEsc(c.name)}</div>`).join("");
  }

  function renderTrending(foods) {
    document.getElementById("trendingSection").hidden = foods.length === 0;
    document.getElementById("trendingTrack").innerHTML = foods.map(f => `
      <div class="trend-card" ${cardAttrs(f)}>
        ${foodImg(f)}
        <p class="name">${tlEsc(f.name)}</p>
        ${tlRatingBadge(f.rating)}
        <p class="price">${tlFormat(f.price)}</p>
        ${addButton(f)}
      </div>`).join("");
  }

  function renderPopular(foods) {
    document.getElementById("popularSection").hidden = foods.length === 0;
    document.getElementById("popularGrid").innerHTML = foods.map(f => `
      <div class="food-card" ${cardAttrs(f)}>
        ${foodImg(f)}
        <h3>${tlEsc(f.name)}</h3>
        ${tlRatingBadge(f.rating)}
        <p class="price">${tlFormat(f.price)}</p>
        ${addButton(f)}
      </div>`).join("");
  }

  async function loadMenu() {
    try {
      menu = await tlLoadMenu(db);
      const available = menu.foods.filter(f => f.available);
      renderDeals(menu.settings.deals);
      renderCategories(menu.categories);
      renderTrending(available.filter(f => f.trending));
      renderPopular(available.filter(f => f.popular));
      renderFilters(available);
      if (document.getElementById("search").value.trim()) seek();
    } catch (err) {
      console.error("Error loading menu:", err);
      const msg = document.getElementById("menuError");
      msg.textContent = "We couldn't load the menu. Please check your connection and refresh the page.";
      msg.style.display = "block";
      ["trendingSection", "popularSection"].forEach(id => (document.getElementById(id).hidden = true));
      document.getElementById("catContainer").innerHTML = "";
    }
  }

  /* ================= Filters (vegetarian, spicy, price, sort) =================
     Built from the dishes themselves — a filter only appears if some dish matches it. */
  const filters = { veg: false, spicy: false, maxPrice: 0, sort: "recommended" };

  const filtersActive = () => filters.veg || filters.spicy || filters.maxPrice > 0 || filters.sort !== "recommended";

  // round a price up to a "nice" number for the price filter
  function nicePrice(n) {
    const step = n >= 10000 ? 2000 : n >= 3000 ? 1000 : 500;
    return Math.ceil(n / step) * step;
  }

  function renderFilters(foods) {
    const bar = document.getElementById("filterBar");
    if (!foods.length) {
      bar.hidden = true;
      return;
    }
    const prices = foods.map(f => f.price).sort((a, b) => a - b);
    const pick = (q) => nicePrice(prices[Math.min(prices.length - 1, Math.floor(prices.length * q))]);
    const priceSteps = [...new Set([pick(0.33), pick(0.66)])].filter(p => p > prices[0] && p < prices[prices.length - 1]);

    const parts = [];
    if (foods.some(f => f.vegetarian)) parts.push(`<button type="button" class="f-chip" data-filter="veg" aria-pressed="false">🥗 Vegetarian</button>`);
    if (foods.some(f => Number(f.spice) > 0)) parts.push(`<button type="button" class="f-chip" data-filter="spicy" aria-pressed="false">🌶️ Spicy</button>`);
    if (priceSteps.length) {
      parts.push(`<select class="f-select" id="fPrice" aria-label="Price">
        <option value="0">💰 Any price</option>
        ${priceSteps.map(p => `<option value="${p}">Under ${tlFormat(p)}</option>`).join("")}
      </select>`);
    }
    parts.push(`<select class="f-select" id="fSort" aria-label="Sort dishes">
      <option value="recommended">↕ Recommended</option>
      <option value="price-asc">Price: low to high</option>
      <option value="price-desc">Price: high to low</option>
      ${foods.some(f => f.rating) ? `<option value="rating">Top rated</option>` : ""}
    </select>`);
    bar.innerHTML = parts.join("");
    bar.hidden = false;
  }

  document.getElementById("filterBar").addEventListener("click", (e) => {
    const chip = e.target.closest("[data-filter]");
    if (!chip) return;
    filters[chip.dataset.filter] = !filters[chip.dataset.filter];
    chip.setAttribute("aria-pressed", String(filters[chip.dataset.filter]));
    seek();
  });

  document.getElementById("filterBar").addEventListener("change", (e) => {
    if (e.target.id === "fPrice") filters.maxPrice = Number(e.target.value) || 0;
    if (e.target.id === "fSort") filters.sort = e.target.value;
    e.target.classList.toggle("is-set", e.target.selectedIndex > 0);
    seek();
  });

  document.getElementById("clearFilters").addEventListener("click", () => {
    Object.assign(filters, { veg: false, spicy: false, maxPrice: 0, sort: "recommended" });
    document.querySelectorAll("#filterBar [data-filter]").forEach(c => c.setAttribute("aria-pressed", "false"));
    document.querySelectorAll("#filterBar select").forEach(s => { s.selectedIndex = 0; s.classList.remove("is-set"); });
    document.getElementById("search").value = "";
    seek();
  });

  function sortFoods(list) {
    const sorted = [...list];
    if (filters.sort === "price-asc") sorted.sort((a, b) => a.price - b.price);
    if (filters.sort === "price-desc") sorted.sort((a, b) => b.price - a.price);
    if (filters.sort === "rating") sorted.sort((a, b) => (b.rating ? b.rating.avg : 0) - (a.rating ? a.rating.avg : 0) || (b.rating ? b.rating.count : 0) - (a.rating ? a.rating.count : 0));
    return sorted;
  }

  function seek() {
    const value = document.getElementById("search").value.trim().toLowerCase();
    const resultsDiv = document.getElementById("results");
    const noResults = document.getElementById("noResults");
    const info = document.getElementById("resultsInfo");

    resultsDiv.innerHTML = "";

    if ((value === "" && !filtersActive()) || !menu) {
      resultsDiv.style.display = "none";
      noResults.style.display = "none";
      info.hidden = true;
      return;
    }

    // A number means "show me meals within this budget".
    const isBudget = value !== "" && !isNaN(value);
    const matches = sortFoods(menu.foods.filter(food => food.available
      && (value === "" || (isBudget
        ? food.price <= Number(value)
        : [food.name, tlCategoryLabel(food), food.badge, food.trending ? "trending" : "", food.popular ? "popular" : ""]
            .join(" ").toLowerCase().includes(value)))
      && (!filters.veg || food.vegetarian)
      && (!filters.spicy || Number(food.spice) > 0)
      && (!filters.maxPrice || food.price < filters.maxPrice)));

    info.hidden = false;
    document.getElementById("resultsCount").textContent =
      `${matches.length} ${matches.length === 1 ? "dish" : "dishes"}`;

    if (matches.length === 0) {
      noResults.style.display = "block";
      resultsDiv.style.display = "none";
      return;
    }

    noResults.style.display = "none";
    resultsDiv.style.display = "grid";

    resultsDiv.innerHTML = matches.map(food => `
      <div class="food-card" ${cardAttrs(food)}>
        ${foodImg(food)}
        <h3>${highlight(food.name, isBudget ? "" : value)}</h3>
        ${tlRatingBadge(food.rating)}
        <p>${tlEsc(tlCategoryLabel(food))}</p>
        <p class="price">${tlFormat(food.price)}</p>
        ${addButton(food)}
      </div>`).join("");
  }

  function openFoodModal(categoryId) {
    if (!menu) return;
    const category = menu.categories.find(c => c.id === categoryId);
    const foods = menu.foodsIn(categoryId);

    document.getElementById("modalTitle").textContent = category ? `${category.name} ${category.emoji}`.trim() : "Foods";
    document.getElementById("naijaList").innerHTML = foods.length
      ? foods.map(meal => `
        <div class="meal-card" ${cardAttrs(meal)}>
          ${foodImg(meal)}
          <div class="meal-info">
            <h4>${tlEsc(meal.name)}</h4>
            ${tlRatingBadge(meal.rating)}
            <p>${tlFormat(meal.price)}</p>
            ${addButton(meal, "add-btn")}
            <div class="view-details">View details <i class="fa-solid fa-arrow-right"></i></div>
          </div>
        </div>`).join("")
      : `<p class="modal-empty">No dishes in this category yet — check back soon!</p>`;

    document.getElementById("naijaModal").style.display = "block";
    document.getElementById("naijaBackdrop").style.display = "block";
    document.body.style.overflow = "hidden";
  }

  function highlight(text, keyword) {
    const safe = tlEsc(text);
    if (!keyword) return safe;
    const pattern = tlEsc(keyword).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return safe.replace(new RegExp(`(${pattern})`, "gi"), "<mark>$1</mark>");
  }

  function closeNaija() {
    document.getElementById("naijaModal").style.display = "none";
    document.getElementById("naijaBackdrop").style.display = "none";
    document.body.style.overflow = "auto";
  }

  // Card click opens the details page; "Add to Cart" adds without leaving;
  // a category opens its pop-up.
  document.addEventListener("click", (e) => {
    const addBtn = e.target.closest("[data-add]");
    if (addBtn) {
      quickAdd(addBtn.dataset.add);
      return;
    }
    const card = e.target.closest("[data-food-id]");
    if (card) {
      location.href = tlDetailsUrl(card.dataset.foodId);
      return;
    }
    const cat = e.target.closest("[data-category]");
    if (cat) openFoodModal(cat.dataset.category);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    if (e.target.matches("[data-food-id]")) {
      e.preventDefault();
      location.href = tlDetailsUrl(e.target.dataset.foodId);
    } else if (e.target.matches("[data-category]")) {
      e.preventDefault();
      openFoodModal(e.target.dataset.category);
    }
  });

  // Quick add uses the dish's first portion and no extras — the same cart line
  // as adding it with default options on the details page.
  function quickAdd(id) {
    const food = menu && menu.findFood(id);
    if (!food) return;
    const size = food.sizes[0];
    addToCart({
      id: food.id,
      foodId: food.id,
      name: food.name,
      price: food.price + (size ? size.price : 0),
      image: food.img,
      size: size ? size.label : null,
      extras: [],
      note: "",
    });
  }

  loadMenu();

  /* ================= Open / closed banner =================
     Live: updates the moment the kitchen pauses orders in the admin. */
  let storeSettings = null;

  function renderStoreBanner() {
    if (!storeSettings) return;
    const banner = document.getElementById("storeBanner");
    const st = tlStoreStatus(storeSettings);
    if (st.canOrder) {
      banner.hidden = true;
      return;
    }
    document.getElementById("storeBannerTitle").textContent = st.paused ? "Orders are paused" : "We're closed right now";
    document.getElementById("storeBannerText").textContent =
      (st.paused ? st.message + " " : st.nextOpen ? `${st.nextOpen}. ` : "") +
      "You can still browse the menu and fill your cart.";
    banner.hidden = false;
  }

  db.collection("settings").doc("store").onSnapshot((snap) => {
    storeSettings = snap.exists ? snap.data() : {};
    renderStoreBanner();
  }, (err) => console.warn("Store status unavailable:", err.message));
  setInterval(renderStoreBanner, 60000);



  
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  function saveCart() {
    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartBadge();
    saveCartToFirebase();
  }

  // Re-read storage so items added on food-details.html aren't overwritten
  function reloadCart() {
    try {
      const stored = JSON.parse(localStorage.getItem("cart"));
      cart = Array.isArray(stored) ? stored : [];
    } catch (e) {
      cart = [];
    }
  }

  function addToCart(item) {
    reloadCart();
    const existing = cart.find(c => c.id === item.id);
    if (existing) {
      existing.quantity += 1;
    } else {
      cart.push({ ...item, quantity: 1 });
    }
    showCartMessage("Cart updated successfully");
    saveCart();
  }

  function updateQtyCart(id, change) {
    const item = cart.find(i => i.id === id);
    if (!item) return;
    item.quantity += change;
    if (item.quantity < 1) {
      cart = cart.filter(i => i.id !== id);
    }
    saveCart();
  }

  function saveCartToFirebase() {
    const user = auth.currentUser;
    if (!user) return;
    db.collection("users").doc(user.uid).set({ cart }, { merge: true });
  }

  function updateCartBadge() {
    const count = cart.reduce((sum, i) => sum + i.quantity, 0);
    const links = document.querySelectorAll('a[href="cart.html"]');
    links.forEach(link => {
      let badge = link.querySelector(".cart-badge");
      if (!badge) {
        badge = document.createElement("span");
        badge.className = "cart-badge";
        badge.style.cssText = "background:red;color:white;border-radius:50%;padding:2px 6px;font-size:11px;margin-left:4px";
        link.appendChild(badge);
      }
      badge.innerText = count;
      badge.style.display = count > 0 ? "inline-block" : "none";
    });
  }


  function showCartMessage(text) {
    let msg = document.getElementById("cart-msg");
    if (!msg) {
      msg = document.createElement("div");
      msg.id = "cart-msg";
      msg.style.cssText = "position:fixed;top:10px;left:50%;transform:translateX(-50%);background:red;color:white;padding:12px 20px;border-radius:8px;z-index:9999";
      document.body.appendChild(msg);
    }
    msg.innerText = text;
    msg.style.display = "block";
    setTimeout(() => msg.style.display = "none", 4000);
  }

  updateCartBadge();

  // Coming back from food-details.html (back button / bfcache): refresh the badge
  window.addEventListener("pageshow", () => {
    reloadCart();
    updateCartBadge();
  });
</script>
