<!doctype html>
<html>
  <head>
    <title>Order Receipt</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <link
      rel="shortcut icon"
      href="https://www.summahealth.org/-/media/project/summahealth/website/page-content/flourish/2_18a_fl_fastfood_400x400.webp?la=en&h=400&w=400&hash=145DC0CF6234A159261389F18A36742A"
      type="image/x-icon"
    />

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="auto-logout.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="menu-service.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
      body {
        font-family: Inter;
        background: bisque;
        padding: 20px;
      }
      .receipt {
        background: white;
        padding: 20px;
        border-radius: 12px;
        max-width: 600px;
        margin: auto;
        box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.362);
      }
      h2 {
        color: red;
      }
      .row {
        display: flex;
        justify-content: space-between;
        margin: 6px 0;
      }
      .item {
        border-bottom: 1px dashed #ddd;
        padding: 6px 0;
      }
      .total {
        font-weight: 700;
        font-size: 18px;
      }
      .log img {
        height: 70px;
        width: 70px;
        object-fit: cover;
      }
      .log {
        display: flex;
        align-items: center;
        flex-direction: column;
      }

      .cancel {
        background-color: transparent;
        display: flex;
        color: red;
        font-size: 1.5rem;
        outline: none;
        border: none;
        font-weight: 900;
      }

      .action-buttons {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
        margin: 20px 0;
      }

      .btn {
        padding: 14px 24px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        min-width: 160px;
        transition: all 0.25s ease;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      }

      .btn-primary {
        background: linear-gradient(135deg, #ff416c, #ff4b2b);
        color: #fff;
      }

      .btn-secondary {
        background: linear-gradient(135deg, #3f87ff, #2b59ff);
        color: #fff;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
      }

      .btn:active {
        transform: scale(0.97);
      }

      .btn:focus {
        outline: 3px solid rgba(0, 0, 0, 0.2);
      }

      .hamburger {
        font-size: 32px;
        cursor: pointer;
        color: var(--red);
        display: none;
      }

      .mobile-menu {
        position: fixed;
        top: 0;
        left: -100%;
        width: 260px;
        height: 100%;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(16px);
        padding: 25px;
        z-index: 4000;
        transition: 0.3s ease;
      }

      .mobile-menu .close-btn {
        font-size: 35px;
        cursor: pointer;
        color: var(--red);
        margin-bottom: 20px;
      }

      .mobile-menu a {
        display: block;
        font-size: 19px;
        padding: 10px 0;
        font-weight: 600;
        color: var(--black);
      }
      body.dark .mobile-menu a {
        color: white !important;
      }

      .mobile-menu a:hover {
        color: var(--red);
      }

      @media (max-width: 480px) {
        .btn {
          width: 100%;
          font-size: 15px;
          padding: 14px;
        }
      }
    </style>
    <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ff0000">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Taste Lounge">
  <script src="pwa.js" defer></script>
</head>
  <body>
    <div class="receipt" id="receipt">
      <div>X</div>
    </div>
  </body>
</html>

<script>
  firebase.initializeApp({
    apiKey: "AIzaSyAW3atuDYr7OeuT2b-Tn_ooD93ZfPqMA4g",
    authDomain: "taste-lounge-3075.firebaseapp.com",
    projectId: "taste-lounge-3075",
  });

  const auth = firebase.auth();
  const db = firebase.firestore();

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get("id");
  const receiptEl = document.getElementById("receipt");

  if (!orderId) {
    receiptEl.innerHTML = "<p>Invalid order.</p>";
  }

  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      window.location.href = "log-in.html";
      return;
    }

    const snap = await db.collection("orders").doc(orderId).get();

    if (!snap.exists) {
      receiptEl.innerHTML = "<p>Order not found.</p>";
      return;
    }

    const order = snap.data();

    window.currentOrder = order;

    window.currentOrderShortId = snap.id.slice(0, 4).toUpperCase();
    window.currentOrderDate = order.createdAt?.toDate
      ? order.createdAt.toDate().toLocaleString()
      : "";

    if (order.userId !== user.uid) {
      receiptEl.innerHTML = "<p>Access denied.</p>";
      return;
    }

    window.currentOrder = {
      id: snap.id,
      ...order,
    };

    renderReceipt(window.currentOrder);
  });

  function renderReceipt(o) {
    const orderDate = o.createdAt?.toDate
      ? o.createdAt.toDate().toLocaleString()
      : "";

    const delivery = o.delivery || o.deliveryInfo || {};

    receiptEl.innerHTML = `
    
    <button type="submit" onclick="cancel()" class="cancel">x</button>
    <div class="log"><img src="taste-lounge-logo.png" alt="">
    <p style="font-weight:600;">Thanks for your patronage </p>
    </div>

    <hr>

    
    <p><strong>Order: #</strong>${o.id ? o.id.slice(0, 4).toUpperCase() : "-"}</p>
    <p><strong>Date: </strong>${orderDate}</p>

    <hr>

    
    <p><strong>Name:</strong> ${tlEsc(delivery.name || "-")}</p>
    <p><strong>Phone:</strong> ${tlEsc(delivery.phone || "-")}</p>
    <p><strong>Address:</strong> ${tlEsc(delivery.address || "-")}</p>

    <hr>

    
    ${o.items
      .map((i) => {
        const qty = i.qty ?? i.quantity ?? 1;
        const price = Number(i.price) || 0;
        const total = price * qty;

        // paid orders: link each dish to its review form
        const canRate = i.foodId && o.payment && o.payment.status === "success";
        const rate = canRate
          ? ` <a href="food-details.html?id=${encodeURIComponent(i.foodId)}#reviews" style="color:#e53935;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;">★ Rate</a>`
          : "";
        return `
        <div class="row">
          <span>${tlEsc(i.name)} × ${qty}${rate}</span>
          <span>${tlFormat(total)}</span>
        </div>
      `;
      })
      .join("")}

    <hr>

    
    <div class="row">
      <span>Subtotal</span>
      <span>${tlFormat(o.pricing?.subtotal)}</span>
    </div>

    ${Number(o.pricing?.discount) > 0 ? `
    <div class="row" style="color:#2e7d32;">
      <span>Promo${o.promo?.code ? " (" + tlEsc(o.promo.code) + ")" : ""}</span>
      <span>−${tlFormat(o.pricing.discount)}</span>
    </div>` : ""}

    <div class="row">
      <span>Delivery</span>
      <span>${Number(o.pricing?.delivery) ? tlFormat(o.pricing.delivery) : "Free"}</span>
    </div>

    ${Number(o.pricing?.pointsDiscount) > 0 ? `
    <div class="row" style="color:#2e7d32;">
      <span>Points used (${Number(o.loyalty?.redeemed || 0).toLocaleString()})</span>
      <span>−${tlFormat(o.pricing.pointsDiscount)}</span>
    </div>` : ""}

    <div class="row total">
      <span>Total</span>
      <span>${tlFormat(o.pricing?.total)}</span>
    </div>

    ${Number(o.loyalty?.earned) > 0 && o.status?.current !== "cancelled" ? `
    <p style="margin:12px 0 0;padding:10px 12px;border-radius:10px;background:#fff8e1;color:#7a5a00;font-size:14px;">
      ⭐ ${o.status?.current === "delivered" ? "You earned" : "You'll earn"} ${Number(o.loyalty.earned).toLocaleString()} points with this order${o.status?.current === "delivered" ? "" : " once it's delivered"}.
    </p>` : ""}

    <br>


    
<div class="action-buttons">
  <button class="btn btn-primary" onclick="downloadPDF()">
    ⬇ Download PDF
  </button>
  <button class="btn btn-secondary" id="reorderBtn" onclick="reOrder()">
    🔁 Order again
  </button>
</div>

  `;
  }

  function cancel() {
    window.location.href = "orders.html";
  }

  // Same dishes and options at today's prices (see tlReorder in menu-service.js)
  async function reOrder() {
    const user = auth.currentUser;
    if (!window.currentOrder || !user) return;
    const btn = document.getElementById("reorderBtn");
    btn.disabled = true;
    try {
      const { added, skipped } = await tlReorder(db, user.uid, window.currentOrder.items);
      if (!added) return alert("Sorry — none of these dishes are available right now.");
      if (skipped.length) alert(`Added to your cart. Not available right now: ${skipped.join(", ")}.`);
      window.location.href = "cart.html";
    } catch (err) {
      console.error("Re-order failed:", err);
      alert("Couldn't add these dishes to your cart. Please try again.");
    } finally {
      btn.disabled = false;
    }
  }

  function formatMoney(n) {
    return Number(n || 0).toLocaleString();
  }

  function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF();

    const RED = "#d32f2f";
    let y = 20;

    pdf.setTextColor(RED);
    pdf.setFontSize(22);
    pdf.text("TASTE LOUNGE", 105, y, { align: "center" });

    y += 8;
    pdf.setFontSize(11);
    pdf.text("Thanks for your patronage ", 105, y, { align: "center" });

    y += 10;
    pdf.setDrawColor("#000");
    pdf.line(10, y, 200, y);

    y += 10;

    pdf.setTextColor("#000");
    pdf.setFontSize(11);

    pdf.text(`Order: #${window.currentOrderShortId}`, 10, y);

    y += 6;
    pdf.text(`Date: ${window.currentOrderDate || ""}`, 10, y);

    y += 10;

    pdf.setDrawColor("#000");
    pdf.line(10, y, 200, y);

    y += 8;

    const d =
      window.currentOrder.delivery || window.currentOrder.deliveryInfo || {};

    pdf.text(`Name: ${d.name || "-"}`, 10, y);
    y += 6;
    pdf.text(`Phone: ${d.phone || "-"}`, 10, y);
    y += 6;
    pdf.text(`Address: ${d.address || "-"}`, 10, y);

    y += 10;
    pdf.setDrawColor("#000");
    pdf.line(10, y, 200, y);

    y += 10;

    pdf.setFont(undefined, "bold");
    pdf.text("Item", 10, y);
    pdf.text("Amount", 190, y, { align: "right" });
    pdf.setFont(undefined, "normal");

    y += 6;

    (window.currentOrder.items || []).forEach((i) => {
      if (y > 270) {
        pdf.addPage();
        y = 20;
      }

      const qty = i.qty ?? i.quantity ?? 1;
      const price = Number(i.price) || 0;
      const total = price * qty;

      pdf.text(`${i.name} × ${qty}`, 10, y);

      pdf.text(`NGN ${formatMoney(total)}`, 190, y, { align: "right" });

      y += 6;
    });

    pdf.setDrawColor("#000");
    pdf.line(10, y, 200, y);

    y += 10;

    const p = window.currentOrder.pricing || {};

    pdf.setFont(undefined, "normal");
    pdf.text("Subtotal", 10, y);

    pdf.text(`NGN ${formatMoney(p.subtotal)}`, 190, y, { align: "right" });

    y += 6;

    pdf.text("Delivery", 10, y);

    pdf.text(`NGN ${formatMoney(p.delivery)}`, 190, y, { align: "right" });

    if (Number(p.discount) > 0) {
      y += 6;
      pdf.text("Promo discount", 10, y);
      pdf.text(`- NGN ${formatMoney(p.discount)}`, 190, y, { align: "right" });
    }
    if (Number(p.pointsDiscount) > 0) {
      y += 6;
      pdf.text("Points used", 10, y);
      pdf.text(`- NGN ${formatMoney(p.pointsDiscount)}`, 190, y, { align: "right" });
    }

    y += 6;

    pdf.setFont(undefined, "bold");
    pdf.text("Total", 10, y);

    pdf.text(`NGN ${formatMoney(p.total) || 0}`, 190, y, { align: "right" });

    y += 10;

    pdf.setFontSize(10);
    pdf.setTextColor("#555");
    pdf.text("Powered by Taste Lounge", 105, y, { align: "center" });

    pdf.save("Taste-Lounge-Receipt.pdf");
  }
</script>
