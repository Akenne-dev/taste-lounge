<script>
  const openBtn = document.querySelector(".hamburger-menu");
  const closeBtn = document.querySelector(".close-menu");
  const menuPanel = document.querySelector(".mobile-menu-panel");

  openBtn.addEventListener("click", () => {
    menuPanel.classList.add("open");
  });

  closeBtn.addEventListener("click", () => {
    menuPanel.classList.remove("open");
  });

  // Open/Closed badge uses the opening hours and "pause orders" switch from Admin → Store Settings
  const status = document.querySelector(".status");
  window.siteContent
    .then(() => firebase.app("site").firestore().collection("settings").doc("store").get())
    .then((snap) => {
      const s = snap.exists ? snap.data() : {};
      if (!tlHasHours(s.hours) && !s.ordersPaused) return; // no hours set: no badge
      const st = tlStoreStatus(s);
      status.textContent = st.canOrder ? "● Open Now" : st.paused ? "● Not taking orders" : "● Closed";
      status.className = st.canOrder ? "status open" : "status closed";
      status.title = st.canOrder ? (st.closesAt ? "Open until " + st.closesAt : "") : st.message;
      status.style.display = "";
    })
    .catch((err) => console.warn("Opening hours unavailable:", err.message));

  // Hero videos come from Admin → Website → Home
  const videoList = { desktop: [], mobile: [] };

  const heroVideos = [
    document.getElementById("heroVideoA"),
    document.getElementById("heroVideoB"),
  ];

  let activeSlot = 0;
  let clipIndex = 0;
  let nextClipIndex = 1;
  let playbackMode = "desktop";
  let transitionLocked = false;
  const isIOSSafari =
    /iP(hone|ad|od)/.test(navigator.userAgent) &&
    /Safari/.test(navigator.userAgent) &&
    !/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent);

  function isMobile() {
    return window.innerWidth <= 768;
  }

  function getMode() {
    return isMobile() ? "mobile" : "desktop";
  }

  function getVideoList(mode = playbackMode) {
    // fall back to the other list if one is empty
    const list = videoList[mode];
    return list.length ? list : videoList[mode === "mobile" ? "desktop" : "mobile"];
  }

  function getActiveVideo() {
    return heroVideos[activeSlot];
  }

  function getInactiveVideo() {
    return heroVideos[1 - activeSlot];
  }

  function applyPlaybackRate(targetVideo) {
    if (isIOSSafari && isMobile()) {
      targetVideo.playbackRate = 1;
      return;
    }

    targetVideo.playbackRate = isMobile() ? 1.1 : 1.5;
  }

  function configureInlinePlayback(targetVideo) {
    targetVideo.muted = true;
    targetVideo.defaultMuted = true;
    targetVideo.playsInline = true;
    targetVideo.setAttribute("playsinline", "");
    targetVideo.setAttribute("webkit-playsinline", "");
  }

  function setVideoSource(targetVideo, src) {
    if (!targetVideo.dataset.src || targetVideo.dataset.src !== src) {
      targetVideo.dataset.src = src;
      targetVideo.src = src;
      targetVideo.load();
    }
  }

  async function safePlay(targetVideo) {
    applyPlaybackRate(targetVideo);
    try {
      await targetVideo.play();
      return true;
    } catch (err) {
      console.log("Autoplay note:", err.message);
      return false;
    }
  }

  async function waitUntilPlayable(targetVideo, timeoutMs = 1600) {
    if (targetVideo.readyState >= 2) {
      return;
    }

    await new Promise((resolve) => {
      let done = false;

      const finish = () => {
        if (done) {
          return;
        }

        done = true;
        resolve();
      };

      targetVideo.addEventListener("loadeddata", finish, { once: true });
      targetVideo.addEventListener("canplay", finish, { once: true });
      targetVideo.addEventListener("canplaythrough", finish, { once: true });
      targetVideo.addEventListener("playing", finish, { once: true });
      setTimeout(finish, timeoutMs);
    });
  }

  function preloadNextClip() {
    const list = getVideoList();
    nextClipIndex = (clipIndex + 1) % list.length;

    const inactive = getInactiveVideo();
    setVideoSource(inactive, list[nextClipIndex]);
    applyPlaybackRate(inactive);
  }

  function makeSlotActive(nextSlot) {
    heroVideos.forEach((item, idx) => {
      if (idx === nextSlot) {
        item.classList.add("is-active");
      } else {
        item.classList.remove("is-active");
      }
    });
    activeSlot = nextSlot;
  }

  async function swapToNextClip() {
    if (transitionLocked) {
      return;
    }

    transitionLocked = true;

    const current = getActiveVideo();
    const incoming = getInactiveVideo();

    await waitUntilPlayable(incoming);

    incoming.currentTime = 0;
    const started = await safePlay(incoming);
    if (!started) {
      transitionLocked = false;
      return;
    }

    makeSlotActive(heroVideos.indexOf(incoming));
    setTimeout(
      () => {
        current.pause();
      },
      isIOSSafari ? 120 : 0,
    );

    clipIndex = nextClipIndex;
    preloadNextClip();
    transitionLocked = false;
  }

  function initHeroVideo() {
    heroVideos.forEach(configureInlinePlayback);

    playbackMode = getMode();
    const list = getVideoList();

    clipIndex = 0;
    setVideoSource(getActiveVideo(), list[clipIndex]);
    makeSlotActive(activeSlot);

    getActiveVideo().addEventListener(
      "loadeddata",
      async () => {
        await safePlay(getActiveVideo());
        preloadNextClip();
      },
      { once: true },
    );

    waitUntilPlayable(getActiveVideo()).then(async () => {
      await safePlay(getActiveVideo());
      preloadNextClip();
    });

    heroVideos.forEach((item) => {
      item.addEventListener("ended", () => {
        if (item === getActiveVideo()) {
          swapToNextClip();
        }
      });

      item.addEventListener("error", () => {
        console.error("Video error, skipping:", item.dataset.src || item.src);
        const listForError = getVideoList();
        clipIndex = (clipIndex + 1) % listForError.length;
        preloadNextClip();
        swapToNextClip();
      });
    });
  }

  window.siteContent.then(({ home }) => {
    videoList.desktop = (home.heroVideosDesktop || []).filter(Boolean);
    videoList.mobile = (home.heroVideosMobile || []).filter(Boolean);
    if (videoList.desktop.length || videoList.mobile.length) initHeroVideo();
  });

  // food cards are added after the content loads, so animate them then
  document.addEventListener("cms:ready", () => {
    if (typeof observer === "undefined") return;
    document.querySelectorAll(".foods-grid .food-card").forEach((card, i) => {
      card.style.opacity = "0";
      card.style.transform = "translateY(30px)";
      setTimeout(() => observer.observe(card), i * 100);
    });
  });

  window.addEventListener("resize", () => {
    if (!videoList.desktop.length && !videoList.mobile.length) return;
    const nextMode = getMode();
    if (nextMode === playbackMode) {
      return;
    }

    playbackMode = nextMode;
    clipIndex = 0;

    const list = getVideoList();
    const active = getActiveVideo();
    setVideoSource(active, list[clipIndex]);
    configureInlinePlayback(active);
    safePlay(active);
    preloadNextClip();
  });
</script>
