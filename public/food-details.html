  <div class="toast" id="toast" role="status" aria-live="polite">
    <div class="toast-media" id="toastMedia"></div>
    <div class="toast-body">
      <strong id="toastTitle"></strong>
      <span id="toastText"></span>
    </div>
    <a href="cart.html" class="toast-cta" id="toastCta">View cart</a>
    <button class="toast-close" id="toastClose" type="button" aria-label="Dismiss"><i
        class="fa-solid fa-xmark"></i></button>
  </div>

  <script>
    /* ================= Firebase ================= */
    const firebaseConfig = {
      apiKey: "AIzaSyAW3atuDYr7OeuT2b-Tn_ooD93ZfPqMA4g",
      authDomain: "taste-lounge-3075.firebaseapp.com",
      projectId: "taste-lounge-3075",
      storageBucket: "taste-lounge-3075.firebasestorage.app",
      messagingSenderId: "923805907944",
      appId: "1:923805907944:web:8c054c78c5cbd75929c25d"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    /* ================= Constants & state ================= */
    const $ = (sel, root = document) => root.querySelector(sel);
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const requestedId = new URLSearchParams(location.search).get("id") || "";
    const MAX_QTY = 20;
    const FAV_KEY = "tl:favorites";
    const SPICE_LABELS = ["Not spicy", "Mild", "Medium", "Hot"];

    let menu = null; // loaded from Firestore — see menu-service.js
    let currentUser = null;
    const state = { food: null, size: null, picked: [], qty: 1, note: "" };

    /* ================= Navigation ================= */
    const mobileMenu = $("#mobileMenu");
    $("#menuBtn").onclick = () => mobileMenu.classList.add("open");
    $("#closeMenu").onclick = () => mobileMenu.classList.remove("open");

    $("#backBtn").onclick = () => {
      const cameFromApp = document.referrer && new URL(document.referrer).origin === location.origin;
      if (cameFromApp && history.length > 1) history.back();
      else location.href = "foods.html";
    };

    /* ================= Storage helpers ================= */
    function readCart() {
      try {
        const cart = JSON.parse(localStorage.getItem("cart"));
        return Array.isArray(cart) ? cart : [];
      } catch (e) {
        return [];
      }
    }

    function writeCart(cart) {
      localStorage.setItem("cart", JSON.stringify(cart));
    }

    function cartCount(cart) {
      return cart.reduce((sum, i) => sum + (Number(i.quantity) || 0), 0);
    }

    function cartSubtotal(cart) {
      return cart.reduce((sum, i) => sum + (Number(i.price) || 0) * (Number(i.quantity) || 0), 0);
    }

    function readFavs() {
      try {
        const favs = JSON.parse(localStorage.getItem(FAV_KEY));
        return Array.isArray(favs) ? favs : [];
      } catch (e) {
        return [];
      }
    }

    /* ================= Firebase cart sync ================= */
    // cart.html reloads the cart from Firebase, so every change is pushed there too.
    let needsSync = false;
    let syncing = null;

    function syncCart(cart) {
      const user = auth.currentUser;
      if (!user) {
        needsSync = true; // pushed as soon as auth is ready
        return;
      }
      needsSync = false;
      const write = db.collection("users").doc(user.uid)
        .set({ cart }, { merge: true })
        .catch((err) => console.error("Cart sync failed:", err));
      const done = Promise.race([write, new Promise((r) => setTimeout(r, 3000))]);
      syncing = done;
      done.then(() => {
        if (syncing === done) syncing = null;
      });
    }

    function whenSynced() {
      return syncing || Promise.resolve();
    }

    // Don't leave for the cart until the latest change has reached Firebase.
    document.addEventListener("click", (e) => {
      const link = e.target.closest('a[href="cart.html"], a[href="checkout.html"]');
      if (!link || !syncing || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
      e.preventDefault();
      whenSynced().then(() => (location.href = link.href));
    });

    auth.onAuthStateChanged((user) => {
      if (!user) {
        location.href = "log-in.html";
        return;
      }
      if (needsSync) syncCart(readCart());
      currentUser = user;
      if (state.food) loadMyReview();
    });

    /* ================= Cart badge ================= */
    function updateBadges(cart = readCart(), bump = false) {
      const count = cartCount(cart);
      document.querySelectorAll(".cart-badge").forEach((badge) => {
        badge.textContent = count > 99 ? "99+" : count;
        badge.classList.toggle("is-visible", count > 0);
        if (bump) {
          badge.classList.remove("bump");
          void badge.offsetWidth;
          badge.classList.add("bump");
        }
      });
    }

    /* ================= Pricing helpers ================= */
    // Portion sizes and extras are set per dish in Admin → Foods.
    function unitPrice(food, size, picked) {
      return food.price + (size ? size.price : 0) + picked.reduce((sum, e) => sum + e.price, 0);
    }

    function isDefaultSize(food, size) {
      return !size || !food.sizes.length || size.id === food.sizes[0].id;
    }

    // Same dish + same options = same cart line. The default options use the
    // plain food id, so it merges with "Add to Cart" on the foods page.
    function lineId(food, size, picked) {
      const parts = [food.id];
      if (!isDefaultSize(food, size)) parts.push(size.id);
      picked.map((e) => e.id).sort().forEach((id) => parts.push(id));
      return parts.join("__");
    }

    function lineName(food, size, picked) {
      let name = food.name;
      if (!isDefaultSize(food, size)) name += ` (${size.label})`;
      if (picked.length) name += " + " + picked.map((e) => e.name).join(", ");
      return name;
    }

    /* ================= Add to cart ================= */
    function addToCart(food, { size = null, picked = [], qty = 1, note = "" } = {}, sourceEl) {
      if (!food.available) return;
      if (!size && food.sizes.length) size = food.sizes[0];

      const cart = readCart();
      const id = lineId(food, size, picked);
      const price = unitPrice(food, size, picked);
      const name = lineName(food, size, picked);
      const existing = cart.find((item) => item.id === id);

      if (existing) {
        existing.quantity = (Number(existing.quantity) || 0) + qty;
        existing.price = price;
        if (note) existing.note = note;
      } else {
        cart.push({
          id,
          foodId: food.id,
          name,
          price,
          image: food.img,
          quantity: qty,
          size: size ? size.label : null,
          extras: picked.map((e) => e.name),
          note,
        });
      }

      writeCart(cart);
      syncCart(cart);
      flyToCart(sourceEl, food.img, () => updateBadges(cart, true));
      showToast({
        img: food.img,
        title: "Added to cart",
        text: `${qty} × ${name} · ${tlFormat(price * qty)}`,
        cta: true,
      });
      updateMeter();
    }

    function flyToCart(sourceEl, imgSrc, done) {
      const target = [...document.querySelectorAll('.desktop-nav a[href="cart.html"], .bottom-nav a[href="cart.html"]')]
        .find((el) => el.offsetParent !== null);
      if (reduceMotion || !sourceEl || !target || !imgSrc || !Element.prototype.animate) return done();

      const s = sourceEl.getBoundingClientRect();
      const t = target.getBoundingClientRect();
      const size = 72;
      const startX = s.left + s.width / 2 - size / 2;
      const startY = s.top + s.height / 2 - size / 2;
      const dx = t.left + t.width / 2 - (startX + size / 2);
      const dy = t.top + t.height / 2 - (startY + size / 2);

      const clone = document.createElement("img");
      clone.src = imgSrc;
      clone.alt = "";
      clone.className = "fly-img";
      clone.style.left = startX + "px";
      clone.style.top = startY + "px";
      document.body.appendChild(clone);

      const anim = clone.animate([
        { transform: "translate(0, 0) scale(.6)", opacity: 0 },
        { transform: "translate(0, -30px) scale(1.1)", opacity: 1, offset: 0.2 },
        { transform: `translate(${dx}px, ${dy}px) scale(.25)`, opacity: .7 },
      ], { duration: 850, easing: "cubic-bezier(.55, 0, .3, 1)" });

      // finish once, even if the animation is paused (e.g. background tab)
      let finished = false;
      const finish = () => {
        if (finished) return;
        finished = true;
        clone.remove();
        done();
      };
      anim.onfinish = finish;
      setTimeout(finish, 1000);
    }

    /* ================= Toast ================= */
    let toastTimer;
    const toast = $("#toast");

    function showToast({ img, icon = "fa-solid fa-circle-check", title, text, cta = false }) {
      $("#toastMedia").innerHTML = img
        ? `<img src="${tlEsc(img)}" alt="" onerror="${TL_IMG_FALLBACK}">`
        : `<i class="${icon}"></i>`;
      $("#toastTitle").innerHTML = (cta ? '<i class="fa-solid fa-circle-check"></i> ' : "") + tlEsc(title);
      $("#toastText").textContent = text;
      $("#toastCta").hidden = !cta;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, 4000);
    }

    function hideToast() {
      toast.classList.remove("show");
    }

    $("#toastClose").onclick = hideToast;
    toast.addEventListener("mouseenter", () => clearTimeout(toastTimer));
    toast.addEventListener("mouseleave", () => (toastTimer = setTimeout(hideToast, 2000)));

    /* ================= Render: product ================= */
    // Only the details the admin filled in are shown.
    function factsFor(f) {
      const facts = [];
      if (f.prepTime) facts.push({ icon: "fa-regular fa-clock", label: "Ready in", value: f.prepTime });
      if (f.calories !== null) facts.push({ icon: "fa-solid fa-fire", label: "Calories", value: `${f.calories.toLocaleString("en-US")} kcal` });
      if (f.serves !== null) facts.push({ icon: "fa-solid fa-user-group", label: "Serves", value: f.serves === 1 ? "1 person" : `${f.serves} people` });
      if (f.spice !== null && SPICE_LABELS[f.spice]) {
        facts.push({ icon: "fa-solid fa-pepper-hot", label: "Spice level", value: SPICE_LABELS[f.spice], spice: f.spice });
      }
      return facts;
    }

    function productTemplate(f) {
      const name = tlEsc(f.name);
      const discount = f.oldPrice > f.price ? Math.round((1 - f.price / f.oldPrice) * 100) : 0;
      const facts = factsFor(f);
      const deliveryTime = menu.settings.deliveryTime;
      let d = 0; // stagger index for the entrance animation

      const factsHtml = facts.length ? `
        <div class="facts reveal" style="--d:${++d}">
          ${facts.map((x) => `
            <div class="fact">
              <i class="${x.icon}"></i>
              <span>${x.label}</span>
              <strong>${tlEsc(x.value)}</strong>
              ${typeof x.spice === "number" ? `<span class="spice-meter" aria-hidden="true">${[1, 2, 3]
                .map((i) => `<i class="fa-solid fa-pepper-hot ${i <= x.spice ? "on" : ""}"></i>`).join("")}</span>` : ""}
            </div>`).join("")}
        </div>` : "";

      const sizesHtml = f.sizes.length ? `
        <div class="block reveal" style="--d:${++d}" role="radiogroup" aria-labelledby="sizeTitle">
          <div class="block-title" id="sizeTitle">Choose your portion <span class="tag tag-req">Required</span></div>
          <div class="sizes">
            ${f.sizes.map((s, i) => `
              <label class="size-card">
                <input type="radio" name="size" value="${tlEsc(s.id)}" ${i === 0 ? "checked" : ""}>
                <span class="size-body">
                  <span class="size-name">${tlEsc(s.label)}</span>
                  ${s.note ? `<span class="size-hint">${tlEsc(s.note)}</span>` : ""}
                  <span class="size-price">${s.price ? "+" + tlFormat(s.price) : "Included"}</span>
                </span>
                <i class="fa-solid fa-circle-check size-check"></i>
              </label>`).join("")}
          </div>
        </div>` : "";

      const extrasHtml = f.extras.length ? `
        <div class="block reveal" style="--d:${++d}" role="group" aria-labelledby="extrasTitle">
          <div class="block-title" id="extrasTitle">Add extras <span class="tag tag-opt">Optional</span></div>
          <div class="extras">
            ${f.extras.map((x) => `
              <label class="extra-row">
                <input type="checkbox" name="extra" value="${tlEsc(x.id)}">
                <span class="check"><i class="fa-solid fa-check"></i></span>
                <span class="extra-name">${tlEsc(x.name)}</span>
                <span class="extra-price">${x.price ? "+" + tlFormat(x.price) : "Free"}</span>
              </label>`).join("")}
          </div>
        </div>` : "";

      const ingredientsHtml = f.ingredients.length ? `
        <div class="block reveal" style="--d:${++d}">
          <h2 class="block-title">What's inside</h2>
          <ul class="chips">${f.ingredients.map((i) => `<li>${tlEsc(i)}</li>`).join("")}</ul>
        </div>` : "";

      const metaBits = [
        `<span id="metaRating">${metaRatingHtml(f.rating)}</span>`,
        f.prepTime ? `<span><i class="fa-regular fa-clock"></i> ${tlEsc(f.prepTime)}</span>` : "",
        f.vegetarian ? `<span><i class="fa-solid fa-leaf" style="color:#2e9e4f"></i> Vegetarian</span>` : "",
        !f.available ? `<span class="unavailable-chip"><i class="fa-solid fa-ban"></i> Currently unavailable</span>` : "",
      ].filter(Boolean).join('<span class="dot"></span>');

      return `
        <section class="product">
          <div class="gallery">
            <div class="media-frame${f.available ? "" : " is-unavailable"}">
              <img id="heroImg" src="${tlEsc(f.img || "taste-lounge-logo.png")}" alt="${name}" onerror="${TL_IMG_FALLBACK}">
              <div class="media-badges">
                ${f.badge ? `<span class="pill pill-red">${tlEsc(f.badge)}</span>` : ""}
                ${discount ? `<span class="pill pill-yellow">-${discount}%</span>` : ""}
                ${f.vegetarian ? `<span class="pill pill-green"><i class="fa-solid fa-leaf"></i> Veg</span>` : ""}
              </div>
              <div class="media-actions">
                <button class="icon-btn" id="favBtn" type="button" aria-pressed="false" aria-label="Save to favourites">
                  <i class="fa-regular fa-heart"></i>
                </button>
                <button class="icon-btn" id="shareBtn" type="button" aria-label="Share this dish">
                  <i class="fa-solid fa-share-nodes"></i>
                </button>
              </div>
            </div>

            <ul class="perks">
              <li><i class="fa-solid fa-truck-fast"></i><div><strong>Fast delivery</strong><span>${deliveryTime ? "Hot at your door in " + tlEsc(deliveryTime) : "Delivered hot to your door"}</span></div></li>
              <li><i class="fa-solid fa-utensils"></i><div><strong>Cooked fresh</strong><span>Prepared only when you order</span></div></li>
              <li><i class="fa-solid fa-shield-halved"></i><div><strong>Secure checkout</strong><span>Pay safely with Paystack</span></div></li>
            </ul>
          </div>

          <div class="info">
            ${f.category ? `<span class="cat-chip reveal">${tlEsc(tlCategoryLabel(f))}</span>` : ""}
            <h1 class="title reveal" style="--d:${++d}">${name}</h1>
            ${metaBits ? `<div class="meta-row reveal" style="--d:${++d}">${metaBits}</div>` : ""}

            <div class="price-row reveal" style="--d:${++d}">
              <span class="price" id="unitPrice">${tlFormat(f.price)}</span>
              ${discount ? `<s class="old-price" id="oldPrice">${tlFormat(f.oldPrice)}</s><span class="save">Save ${discount}%</span>` : ""}
              <span class="per-item">per item</span>
            </div>

            ${f.description ? `<p class="desc reveal" style="--d:${++d}">${tlEsc(f.description)}</p>` : ""}

            ${factsHtml}

            ${f.adult ? `<div class="notice reveal" style="--d:${++d}"><i class="fa-solid fa-circle-exclamation"></i><span><strong>18+ only.</strong> ID may be requested on delivery. Please drink responsibly.</span></div>` : ""}

            ${sizesHtml}
            ${extrasHtml}
            ${ingredientsHtml}

            <div class="block reveal" style="--d:${++d}">
              <label class="block-title" for="note">Special instructions <span class="tag tag-opt">Optional</span></label>
              <textarea class="note" id="note" maxlength="140" rows="2"
                placeholder="E.g. less pepper, no onions, sauce on the side…"></textarea>
              <div class="counter"><span id="noteCount">0</span>/140</div>
            </div>

            <div class="meter reveal" id="meter" style="--d:${++d}" hidden>
              <div class="meter-text" id="meterText"></div>
              <div class="meter-track" aria-hidden="true">
                <div class="meter-preview" id="meterPreview"></div>
                <div class="meter-fill" id="meterFill"></div>
              </div>
            </div>

            <div class="buy-bar" id="buyBar">
              <div class="stepper" role="group" aria-label="Quantity">
                <button type="button" id="qtyMinus" aria-label="Decrease quantity"><i class="fa-solid fa-minus"></i></button>
                <output id="qtyVal" aria-live="polite">1</output>
                <button type="button" id="qtyPlus" aria-label="Increase quantity"><i class="fa-solid fa-plus"></i></button>
              </div>
              ${f.available ? `
                <button type="button" class="btn-primary" id="addBtn">
                  <span class="btn-label" id="addLabel"><i class="fa-solid fa-bag-shopping"></i><span class="lbl-long">Add to cart</span><span class="lbl-short">Add</span></span>
                  <span class="btn-total" id="totalVal">${tlFormat(f.price)}</span>
                </button>
                <button type="button" class="btn-ghost" id="buyNowBtn">Buy now</button>` : `
                <button type="button" class="btn-primary" id="addBtn" disabled>
                  <span class="btn-label"><i class="fa-solid fa-ban"></i> Unavailable</span>
                  <span class="btn-total" id="totalVal">${tlFormat(f.price)}</span>
                </button>`}
            </div>
          </div>
        </section>`;
    }

    function renderFood(food) {
      Object.assign(state, { food, size: food.sizes[0] || null, picked: [], qty: 1, note: "" });

      document.title = `${food.name} — Taste Lounge`;
      const meta = document.querySelector('meta[name="description"]');
      if (meta && food.description) meta.setAttribute("content", food.description);

      $("#crumbCat").textContent = food.category ? food.category.name : "Menu";
      $("#crumbName").textContent = food.name;

      $("#product").innerHTML = productTemplate(food);
      bindProduct();
      renderRelated(food);
      loadReviews();
      if (currentUser) loadMyReview();
      updatePrice(false);
      updateFavButton();
    }

    function showNotFound(message) {
      $("#crumbName").textContent = "Not found";
      $("#product").innerHTML = `
        <div class="empty-state reveal">
          <div class="empty-emoji">🍽️</div>
          <h1>Dish not found</h1>
          <p>${tlEsc(message || "This dish may have been removed from the menu, or the link is broken.")}</p>
          <a class="btn-primary" href="foods.html"><span class="btn-label"><i class="fa-solid fa-utensils"></i> Browse the menu</span></a>
        </div>`;
    }

    /* ================= Interactions ================= */
    function bindProduct() {
      const product = $("#product");
      const food = state.food;

      product.addEventListener("change", (e) => {
        if (e.target.name === "size") {
          state.size = food.sizes.find((s) => s.id === e.target.value) || food.sizes[0];
          updatePrice();
        }
        if (e.target.name === "extra") {
          e.target.closest(".extra-row").classList.toggle("is-on", e.target.checked);
          const checked = [...product.querySelectorAll('input[name="extra"]:checked')].map((i) => i.value);
          state.picked = food.extras.filter((x) => checked.includes(x.id));
          updatePrice();
        }
      });

      const note = $("#note");
      note.addEventListener("input", () => {
        state.note = note.value.trim();
        $("#noteCount").textContent = note.value.length;
      });

      $("#qtyMinus").onclick = () => setQty(state.qty - 1);
      $("#qtyPlus").onclick = () => setQty(state.qty + 1);
      $("#favBtn").onclick = toggleFav;
      $("#shareBtn").onclick = shareDish;

      if (!food.available) return;

      $("#addBtn").onclick = () => {
        const hero = $("#heroImg");
        const heroVisible = hero && hero.getBoundingClientRect().bottom > 80;
        addToCart(food, currentSelection(), heroVisible ? hero : $("#addBtn"));
        celebrateButton();
      };

      $("#buyNowBtn").onclick = (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        btn.textContent = "Opening cart…";
        addToCart(food, currentSelection(), $("#heroImg"));
        whenSynced().then(() => (location.href = "cart.html"));
      };
    }

    function currentSelection() {
      return { size: state.size, picked: state.picked.slice(), qty: state.qty, note: state.note };
    }

    function setQty(n) {
      state.qty = Math.max(1, Math.min(MAX_QTY, n));
      updatePrice();
      if (n > MAX_QTY) {
        showToast({ icon: "fa-solid fa-circle-info", title: "That's a feast!", text: `For more than ${MAX_QTY}, please order in a new batch.` });
      }
    }

    let addedTimer;
    function celebrateButton() {
      const btn = $("#addBtn");
      const label = $("#addLabel");
      btn.classList.add("is-added");
      label.innerHTML = '<i class="fa-solid fa-check"></i><span class="lbl-long">Added!</span><span class="lbl-short">Added</span>';
      clearTimeout(addedTimer);
      addedTimer = setTimeout(() => {
        btn.classList.remove("is-added");
        label.innerHTML = '<i class="fa-solid fa-bag-shopping"></i><span class="lbl-long">Add to cart</span><span class="lbl-short">Add</span>';
      }, 1600);
    }

    function retick(el) {
      if (!el || reduceMotion) return;
      el.classList.remove("tick");
      void el.offsetWidth;
      el.classList.add("tick");
    }

    function updatePrice(animate = true) {
      const f = state.food;
      const unit = unitPrice(f, state.size, state.picked);
      const unitEl = $("#unitPrice");
      const totalEl = $("#totalVal");
      const unitChanged = unitEl.textContent !== tlFormat(unit);

      unitEl.textContent = tlFormat(unit);
      if ($("#oldPrice")) $("#oldPrice").textContent = tlFormat(f.oldPrice + (unit - f.price));
      totalEl.textContent = tlFormat(unit * state.qty);
      $("#qtyVal").textContent = state.qty;
      $("#qtyMinus").disabled = state.qty <= 1;
      $("#qtyPlus").disabled = state.qty >= MAX_QTY;

      if (animate) {
        retick(totalEl);
        if (unitChanged) retick(unitEl);
      }
      updateMeter();
    }

    // Free-delivery progress (threshold set in Admin → Store Settings):
    // solid = already in the cart, striped = after adding the current selection.
    function updateMeter() {
      const meter = $("#meter");
      if (!state.food || !meter) return;
      const goalAmount = menu.settings.freeDeliveryOver;
      meter.hidden = !goalAmount || !state.food.available;
      if (meter.hidden) return;

      const inCart = cartSubtotal(readCart());
      const selection = unitPrice(state.food, state.size, state.picked) * state.qty;
      const after = inCart + selection;
      const pct = (v) => Math.min(100, (v / goalAmount) * 100) + "%";
      const goal = tlFormat(goalAmount);

      $("#meterFill").style.width = pct(inCart);
      $("#meterPreview").style.width = pct(after);

      let html;
      if (inCart > goalAmount) {
        html = `<i class="fa-solid fa-gift"></i><span>Your cart already qualifies for <strong>FREE delivery</strong> 🎉</span>`;
      } else if (after > goalAmount) {
        html = `<i class="fa-solid fa-gift"></i><span>Add this and you unlock <strong>FREE delivery</strong> 🎉</span>`;
      } else {
        const left = goalAmount - after;
        html = left > 0
          ? `<i class="fa-solid fa-truck-fast"></i><span>Add this and you're <strong>${tlFormat(left)}</strong> away from <strong>FREE delivery</strong> (orders over ${goal})</span>`
          : `<i class="fa-solid fa-truck-fast"></i><span>One more item unlocks <strong>FREE delivery</strong> (orders over ${goal})</span>`;
      }
      $("#meterText").innerHTML = html;
      meter.classList.toggle("is-unlocked", after > goalAmount);
    }

    /* ================= Favourites & share ================= */
    function updateFavButton() {
      const btn = $("#favBtn");
      if (!btn || !state.food) return;
      const on = readFavs().includes(state.food.id);
      btn.classList.toggle("is-active", on);
      btn.setAttribute("aria-pressed", on);
      btn.setAttribute("aria-label", on ? "Remove from favourites" : "Save to favourites");
      btn.innerHTML = `<i class="${on ? "fa-solid" : "fa-regular"} fa-heart"></i>`;
    }

    function toggleFav() {
      const id = state.food.id;
      const favs = readFavs();
      const on = !favs.includes(id);
      const next = on ? [...favs, id] : favs.filter((x) => x !== id);
      try {
        localStorage.setItem(FAV_KEY, JSON.stringify(next));
      } catch (e) { }
      updateFavButton();
      showToast({
        icon: on ? "fa-solid fa-heart" : "fa-regular fa-heart",
        title: on ? "Saved to favourites" : "Removed from favourites",
        text: state.food.name,
      });
    }

    async function shareDish() {
      const data = {
        title: `${state.food.name} — Taste Lounge`,
        text: `Check out ${state.food.name} (${tlFormat(state.food.price)}) on Taste Lounge 😋`,
        url: location.href,
      };
      if (navigator.share) {
        try {
          await navigator.share(data);
        } catch (e) { /* user cancelled */ }
        return;
      }
      try {
        await navigator.clipboard.writeText(location.href);
        showToast({ icon: "fa-solid fa-link", title: "Link copied", text: "Share it with someone hungry!" });
      } catch (e) {
        showToast({ icon: "fa-solid fa-link", title: "Copy this link", text: location.href });
      }
    }

    /* ================= Related dishes ================= */
    function renderRelated(food) {
      const available = menu.foods.filter((f) => f.available && f.id !== food.id);
      const sameCat = available.filter((f) => food.categoryId && f.categoryId === food.categoryId);
      const highlights = available.filter((f) => (f.trending || f.popular) && !sameCat.includes(f));

      const seen = new Set([food.name]);
      const list = [];
      for (const f of [...sameCat, ...highlights]) {
        if (seen.has(f.name)) continue;
        seen.add(f.name);
        list.push(f);
        if (list.length === 8) break;
      }
      $("#related").hidden = list.length === 0;
      if (!list.length) return;

      $("#relTrack").innerHTML = list.map((f) => `
        <article class="rel-card" data-food-id="${tlEsc(f.id)}" tabindex="0" role="link" aria-label="View ${tlEsc(f.name)}">
          <div class="rel-img">
            <img src="${tlEsc(f.img || "taste-lounge-logo.png")}" alt="${tlEsc(f.name)}" loading="lazy" onerror="${TL_IMG_FALLBACK}">
            ${f.badge ? `<span class="rel-badge">${tlEsc(f.badge)}</span>` : ""}
          </div>
          <div class="rel-body">
            <h3>${tlEsc(f.name)}</h3>
            <p class="rel-cat">${tlEsc(tlCategoryLabel(f))}${f.rating ? ` · <span style="color:var(--yellow)">★</span> ${f.rating.avg.toFixed(1)}` : ""}</p>
            <div class="rel-foot">
              <strong>${tlFormat(f.price + (f.sizes[0] ? f.sizes[0].price : 0))}</strong>
              <button class="rel-add" type="button" data-add="${tlEsc(f.id)}" aria-label="Add ${tlEsc(f.name)} to cart">
                <i class="fa-solid fa-plus"></i>
              </button>
            </div>
          </div>
        </article>`).join("");
    }

    // Card clicks open that dish; the "+" button adds it without leaving the page.
    $("#relTrack").addEventListener("click", (e) => {
      const add = e.target.closest("[data-add]");
      if (add) {
        const food = menu && menu.findFood(add.dataset.add);
        if (food) addToCart(food, {}, add.closest(".rel-card").querySelector("img"));
        return;
      }
      const card = e.target.closest("[data-food-id]");
      if (card) location.href = tlDetailsUrl(card.dataset.foodId);
    });

    $("#relTrack").addEventListener("keydown", (e) => {
      if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-food-id]")) {
        e.preventDefault();
        location.href = tlDetailsUrl(e.target.dataset.foodId);
      }
    });

    /* ================= Ratings & reviews =================
       Only customers with a paid order containing this dish can review it
       (enforced by the Firestore rules). Each review and the dish's totals
       (ratings/{foodId}: { sum, count }) are written together in a transaction. */
    const REVIEW_PAGE = 5;
    const STAR_WORDS = ["", "Terrible", "Poor", "Okay", "Good", "Excellent"];
    const rv = { list: [], shown: REVIEW_PAGE, totals: null, mine: null, orderId: null, editing: false };

    const millis = (ts) => (ts && ts.toMillis ? ts.toMillis() : 0);

    function metaRatingHtml(rating) {
      return rating
        ? `<a href="#reviews" class="meta-rating">${tlStarsHtml(rating.avg)} <strong>${rating.avg.toFixed(1)}</strong> (${rating.count} rating${rating.count === 1 ? "" : "s"})</a>`
        : `<a href="#reviews" class="meta-rating"><i class="fa-regular fa-star"></i> No ratings yet</a>`;
    }

    function reviewDate(ts) {
      if (!millis(ts)) return "Just now";
      const days = Math.floor((Date.now() - millis(ts)) / 86400000);
      if (days < 1) return "Today";
      if (days < 2) return "Yesterday";
      if (days < 30) return `${days} days ago`;
      return new Date(millis(ts)).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
    }

    async function loadReviews() {
      const food = state.food;
      $("#reviews").hidden = false;
      try {
        const [snap, totalsSnap] = await Promise.all([
          db.collection("reviews").where("foodId", "==", food.id).where("hidden", "==", false).get(),
          db.collection("ratings").doc(food.id).get(),
        ]);
        rv.list = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => millis(b.createdAt) - millis(a.createdAt));
        rv.totals = tlRatingFrom(totalsSnap.exists ? totalsSnap.data() : null);
      } catch (err) {
        console.error("Could not load reviews:", err);
        rv.list = [];
        rv.totals = food.rating;
      }
      food.rating = rv.totals;
      $("#metaRating").innerHTML = metaRatingHtml(rv.totals);
      renderReviewSummary();
      renderReviewList();
      // arrived from a "★ Rate" link (…#reviews): scroll once the section exists
      if (location.hash === "#reviews" && !rv.scrolled) {
        rv.scrolled = true;
        $("#reviews").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" });
      }
    }

    function renderReviewSummary() {
      const t = rv.totals;
      if (!t) {
        $("#rvSummary").innerHTML = `<h3>No ratings yet</h3>
          <p class="rv-note">Ordered ${tlEsc(state.food.name)}? Be the first to tell others how it was.</p>`;
        return;
      }
      const counts = [0, 0, 0, 0, 0, 0];
      rv.list.forEach((r) => counts[r.rating]++);
      const listed = rv.list.length || 1;
      $("#rvSummary").innerHTML = `
        <div class="rv-score">
          <div class="rv-big">${t.avg.toFixed(1)}</div>
          <div>${tlStarsHtml(t.avg, "lg")}<div class="rv-total">Based on ${t.count} rating${t.count === 1 ? "" : "s"}</div></div>
        </div>
        ${[5, 4, 3, 2, 1].map((n) => `
          <div class="rv-bar">
            <span>${n} ★</span>
            <div class="rv-bar-track"><div class="rv-bar-fill" style="width:${(counts[n] / listed) * 100}%"></div></div>
            <span>${counts[n]}</span>
          </div>`).join("")}`;
    }

    function reviewItemHtml(r) {
      const initial = String(r.userName || "?").trim().charAt(0).toUpperCase();
      const edited = millis(r.updatedAt) - millis(r.createdAt) > 60000;
      return `
        <article class="rv-item">
          <div class="rv-head">
            <div class="rv-avatar" aria-hidden="true">${tlEsc(initial)}</div>
            <div class="rv-who">
              <strong>${tlEsc(r.userName)}</strong>
              <span class="rv-meta">${reviewDate(r.createdAt)}${edited ? " · edited" : ""}</span>
            </div>
            <span class="rv-verified"><i class="fa-solid fa-circle-check"></i> Verified order</span>
          </div>
          <div style="margin-top:8px">${tlStarsHtml(r.rating)}</div>
          ${r.comment ? `<p class="rv-text">${tlEsc(r.comment)}</p>` : ""}
        </article>`;
    }

    function renderReviewList() {
      const shown = rv.list.slice(0, rv.shown);
      $("#rvList").innerHTML = shown.length
        ? shown.map(reviewItemHtml).join("")
        : `<div class="rv-empty">No reviews yet — customers who order this dish can leave the first one.</div>`;
      $("#rvMore").hidden = rv.list.length <= rv.shown;
    }

    $("#rvMore").onclick = () => {
      rv.shown += REVIEW_PAGE;
      renderReviewList();
    };

    // Has this customer reviewed the dish, and do they have a paid order containing it?
    async function loadMyReview() {
      const food = state.food;
      if (!currentUser || !food) return;
      $("#rvMine").innerHTML = `<h3>Your review</h3><p class="rv-note">Checking your orders…</p>`;
      try {
        const [mineSnap, orderSnap] = await Promise.all([
          db.collection("reviews").doc(`${food.id}__${currentUser.uid}`).get(),
          db.collection("orders").where("userId", "==", currentUser.uid).get(),
        ]);
        rv.mine = mineSnap.exists ? mineSnap.data() : null;
        const paid = orderSnap.docs
          .map((d) => ({ id: d.id, ...d.data() }))
          .filter((o) => Array.isArray(o.foodIds) && o.foodIds.includes(food.id) && o.payment && o.payment.status === "success")
          .sort((a, b) => millis(b.createdAt) - millis(a.createdAt));
        rv.orderId = paid.length ? paid[0].id : null;
      } catch (err) {
        console.error("Could not check your review:", err);
        $("#rvMine").innerHTML = `<h3>Your review</h3><p class="rv-note">We couldn't check your orders right now. Please refresh to try again.</p>`;
        return;
      }
      renderMyReview();
    }

    function renderMyReview() {
      const box = $("#rvMine");
      const food = state.food;

      if (rv.mine && !rv.editing) {
        box.innerHTML = `
          <h3>Your review</h3>
          <div>${tlStarsHtml(rv.mine.rating, "lg")} <strong style="margin-left:6px">${STAR_WORDS[rv.mine.rating]}</strong></div>
          ${rv.mine.comment ? `<p class="rv-text">${tlEsc(rv.mine.comment)}</p>` : ""}
          ${rv.mine.hidden ? `<p class="rv-hidden-note"><i class="fa-solid fa-eye-slash"></i> The restaurant has hidden this review, so it doesn't count towards the rating.</p>` : ""}
          <div class="rv-actions">
            <button type="button" class="btn-ghost" id="rvEdit"><i class="fa-solid fa-pen"></i> Edit</button>
            <button type="button" class="btn-link" id="rvDelete">Delete</button>
          </div>`;
        $("#rvEdit").onclick = () => {
          rv.editing = true;
          renderMyReview();
        };
        $("#rvDelete").onclick = deleteMyReview;
        return;
      }

      if (!rv.mine && !rv.orderId) {
        box.innerHTML = `
          <h3>Rate this dish</h3>
          <p class="rv-note"><i class="fa-solid fa-receipt"></i>Only customers who've ordered ${tlEsc(food.name)} can review it, so every review comes from a real order.</p>`;
        return;
      }

      const current = rv.mine ? rv.mine.rating : 0;
      const comment = rv.mine ? rv.mine.comment : "";
      box.innerHTML = `
        <form class="rv-form" id="rvForm" novalidate>
          <h3>${rv.mine ? "Edit your review" : "Rate this dish"}</h3>
          ${rv.mine ? "" : `<p class="rv-note">You've ordered this — how was it?</p>`}
          <div class="star-picker" role="radiogroup" aria-label="Your rating">
            ${[5, 4, 3, 2, 1].map((n) => `
              <input type="radio" name="rvStar" id="rvStar${n}" value="${n}" ${n === current ? "checked" : ""}>
              <label for="rvStar${n}" title="${STAR_WORDS[n]}" aria-label="${n} star${n > 1 ? "s" : ""}: ${STAR_WORDS[n]}">★</label>`).join("")}
          </div>
          <div class="star-hint" id="rvHint">${current ? STAR_WORDS[current] : "Tap a star to rate"}</div>
          <textarea class="note" id="rvComment" maxlength="500"
            placeholder="What did you like? Taste, portion, packaging… (optional)">${tlEsc(comment)}</textarea>
          <div class="counter"><span id="rvCount">${comment.length}</span>/500</div>
          <div class="rv-actions">
            <button type="submit" class="btn-primary" id="rvSubmit"><span class="btn-label">${rv.mine ? "Save changes" : "Post review"}</span></button>
            ${rv.mine ? `<button type="button" class="btn-link" id="rvCancel">Cancel</button>` : ""}
          </div>
        </form>`;

      $("#rvForm").addEventListener("change", (e) => {
        if (e.target.name === "rvStar") $("#rvHint").textContent = STAR_WORDS[e.target.value];
      });
      $("#rvComment").addEventListener("input", (e) => ($("#rvCount").textContent = e.target.value.length));
      if ($("#rvCancel")) {
        $("#rvCancel").onclick = () => {
          rv.editing = false;
          renderMyReview();
        };
      }
      $("#rvForm").addEventListener("submit", submitMyReview);
    }

    // Public name on the review: "Ada O." from the profile name, never the email.
    async function reviewerName() {
      let name = "";
      try {
        const snap = await db.collection("users").doc(currentUser.uid).get();
        name = (snap.exists && (snap.data().username || snap.data().name)) || "";
      } catch (e) { }
      name = String(name || currentUser.displayName || "").trim();
      if (!name) return "Taste Lounge customer";
      const parts = name.split(/\s+/);
      const short = parts.length > 1 ? `${parts[0]} ${parts[parts.length - 1].charAt(0)}.` : parts[0];
      return (short.charAt(0).toUpperCase() + short.slice(1)).slice(0, 40);
    }

    async function submitMyReview(e) {
      e.preventDefault();
      const picked = $("#rvForm").querySelector('input[name="rvStar"]:checked');
      if (!picked) {
        showToast({ icon: "fa-solid fa-star", title: "Pick a rating", text: "Tap 1 to 5 stars first." });
        return;
      }
      const rating = Number(picked.value);
      const comment = $("#rvComment").value.trim().slice(0, 500);
      const btn = $("#rvSubmit");
      btn.disabled = true;
      btn.querySelector(".btn-label").textContent = "Saving…";

      const food = state.food;
      const reviewRef = db.collection("reviews").doc(`${food.id}__${currentUser.uid}`);
      const totalsRef = db.collection("ratings").doc(food.id);
      try {
        const userName = await reviewerName();
        const now = firebase.firestore.FieldValue.serverTimestamp();
        await db.runTransaction(async (tx) => {
          const reviewSnap = await tx.get(reviewRef);
          const totalsSnap = await tx.get(totalsRef);
          const totals = totalsSnap.exists ? totalsSnap.data() : { sum: 0, count: 0 };
          if (!reviewSnap.exists) {
            tx.set(reviewRef, {
              foodId: food.id, userId: currentUser.uid, userName, rating, comment,
              orderId: rv.orderId, hidden: false, createdAt: now, updatedAt: now,
            });
            tx.set(totalsRef, { sum: totals.sum + rating, count: totals.count + 1 });
          } else {
            const old = reviewSnap.data();
            tx.update(reviewRef, { rating, comment, userName, updatedAt: now });
            if (!old.hidden && old.rating !== rating) {
              tx.set(totalsRef, { sum: totals.sum - old.rating + rating, count: totals.count });
            }
          }
        });
        rv.editing = false;
        showToast({ icon: "fa-solid fa-star", title: "Thanks for your review!", text: `${rating}★ for ${food.name}` });
        await Promise.all([loadReviews(), loadMyReview()]);
      } catch (err) {
        console.error("Could not save review:", err);
        showToast({ icon: "fa-solid fa-circle-exclamation", title: "Couldn't save your review", text: "Please try again in a moment." });
        btn.disabled = false;
        btn.querySelector(".btn-label").textContent = rv.mine ? "Save changes" : "Post review";
      }
    }

    async function deleteMyReview() {
      if (!confirm("Delete your review?")) return;
      const food = state.food;
      const reviewRef = db.collection("reviews").doc(`${food.id}__${currentUser.uid}`);
      const totalsRef = db.collection("ratings").doc(food.id);
      try {
        await db.runTransaction(async (tx) => {
          const reviewSnap = await tx.get(reviewRef);
          const totalsSnap = await tx.get(totalsRef);
          if (!reviewSnap.exists) return;
          const old = reviewSnap.data();
          const totals = totalsSnap.exists ? totalsSnap.data() : { sum: 0, count: 0 };
          tx.delete(reviewRef);
          if (!old.hidden) tx.set(totalsRef, { sum: totals.sum - old.rating, count: totals.count - 1 });
        });
        rv.editing = false;
        showToast({ icon: "fa-regular fa-trash-can", title: "Review deleted", text: food.name });
        await Promise.all([loadReviews(), loadMyReview()]);
      } catch (err) {
        console.error("Could not delete review:", err);
        showToast({ icon: "fa-solid fa-circle-exclamation", title: "Couldn't delete your review", text: "Please try again in a moment." });
      }
    }

    /* ================= Boot ================= */
    function refreshFromStorage() {
      updateBadges();
      updateMeter();
      updateFavButton();
    }

    window.addEventListener("storage", (e) => {
      if (e.key === "cart" || e.key === FAV_KEY) refreshFromStorage();
    });
    window.addEventListener("pageshow", refreshFromStorage); // back/forward cache

    async function boot() {
      updateBadges();
      if (!requestedId) {
        showNotFound("No dish was selected. Pick something delicious from the menu!");
        return;
      }
      try {
        menu = await tlLoadMenu(db);
      } catch (err) {
        console.error("Error loading menu:", err);
        showNotFound("We couldn't load this dish right now. Please check your connection and try again.");
        return;
      }
      const food = menu.findFood(requestedId);
      if (food) renderFood(food);
      else showNotFound();
    }

    boot();
  </script>
</body>

</html>
