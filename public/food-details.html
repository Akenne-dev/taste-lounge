<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#FFF6E9" />
  <meta name="description" content="Freshly prepared meals from Taste Lounge, delivered hot to your door." />
  <title>Food Details — Taste Lounge</title>

  <link rel="shortcut icon"
    href="https://www.summahealth.org/-/media/project/summahealth/website/page-content/flourish/2_18a_fl_fastfood_400x400.webp?la=en&h=400&w=400&hash=145DC0CF6234A159261389F18A36742A"
    type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css" />

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="auto-logout.js"></script>
  <script src="menu-service.js"></script>

  <style>
    /* ============ Design tokens (Taste Lounge theme) ============ */
    :root {
      --red: #ff0000;
      --red-strong: #d90000;
      --red-grad: linear-gradient(120deg, #ff0000, #ff5252);
      --red-soft: #fff1f1;
      --yellow: #FBC02D;
      --yellow-soft: #fff8e1;
      --cream: #FFF6E9;
      --black: #1A1A1A;
      --white: #fff;
      --green: #2e9e4f;

      --bg: #ffffff;
      --bg-glow: #FFF6E9;
      --surface: #ffffff;
      --surface-2: #FFF6E9;
      --text: #1A1A1A;
      --text-2: #3d3a37;
      --muted: #77706a;
      --border: #f1e4d3;
      --border-strong: #d9cbb8;
      --ring: rgba(255, 0, 0, 0.22);
      --star-empty: #e2dbd2;
      --sk-1: #f3ece3;
      --sk-2: #fbf7f2;

      --shadow-sm: 0 2px 8px rgba(26, 26, 26, 0.06);
      --shadow-md: 0 12px 30px rgba(26, 26, 26, 0.09);
      --shadow-lg: 0 24px 60px rgba(26, 26, 26, 0.14);
      --radius: 20px;
    }

    body.dark {
      --bg: #121212;
      --bg-glow: #1b1717;
      --surface: #1e1e1e;
      --surface-2: #262222;
      --text: #f3f3f3;
      --text-2: #d6d1cd;
      --muted: #a9a3a0;
      --border: #332f2f;
      --border-strong: #4a4545;
      --red-soft: rgba(255, 0, 0, 0.13);
      --yellow-soft: rgba(251, 192, 45, 0.1);
      --ring: rgba(255, 82, 82, 0.35);
      --star-empty: #4a4545;
      --sk-1: #232020;
      --sk-2: #2d2929;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Poppins", Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(1200px 420px at 50% -60px, var(--bg-glow), transparent 70%),
        var(--bg);
      background-repeat: no-repeat;
      color: var(--text);
      min-height: 100vh;
      padding-top: 70px;
      -webkit-font-smoothing: antialiased;
    }

    img {
      display: block;
      max-width: 100%;
    }

    button {
      font-family: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 2px;
    }

    .muted {
      color: var(--muted);
    }

    .img-fallback {
      object-fit: contain !important;
      padding: 18%;
      background: var(--surface-2);
    }

    /* ============ Header / navigation (matches the rest of the app) ============ */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 90px;
      z-index: 3000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--white);
      color: var(--red);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 16px;
      box-shadow: var(--shadow-sm);
      transition: background .2s, color .2s, transform .2s;
    }

    .back-btn:hover {
      background: var(--red);
      color: var(--white);
      transform: translateX(-2px);
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      color: var(--red);
      letter-spacing: -0.01em;
    }

    .desktop-nav {
      display: flex;
      gap: 60px;
    }

    .desktop-nav a {
      font-size: 18px;
      font-weight: 600;
      color: var(--black);
      text-decoration: none;
      position: relative;
      transition: color .2s;
    }

    .desktop-nav a:hover,
    .desktop-nav a.active {
      color: var(--red);
    }

    .desktop-nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 100%;
      height: 3px;
      background: var(--red);
      border-radius: 8px;
    }

    .hamburger {
      font-size: 32px;
      cursor: pointer;
      color: var(--red);
      display: none;
      background: none;
      border: none;
      line-height: 1;
    }

    .mobile-menu {
      position: fixed;
      top: 0;
      left: -100%;
      width: 260px;
      height: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      padding: 25px;
      z-index: 4000;
      transition: .3s ease;
      box-shadow: var(--shadow-lg);
    }

    .mobile-menu.open {
      left: 0;
    }

    .mobile-menu .close-btn {
      font-size: 35px;
      cursor: pointer;
      color: var(--red);
      margin-bottom: 20px;
      background: none;
      border: none;
      line-height: 1;
    }

    .mobile-menu a {
      display: block;
      font-size: 19px;
      padding: 10px 0;
      font-weight: 600;
      color: var(--black);
      text-decoration: none;
    }

    .mobile-menu a:hover {
      color: var(--red);
    }

    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: var(--white);
      box-shadow: 0 -4px 14px rgba(0, 0, 0, 0.07);
      justify-content: space-around;
      align-items: center;
      z-index: 3000;
    }

    .bottom-nav a {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 12px;
      color: var(--black);
      text-decoration: none;
    }

    .bottom-nav i {
      font-size: 20px;
      margin-bottom: 3px;
    }

    .bottom-nav a.active-bottom {
      color: var(--red);
    }

    .cart-badge {
      display: none;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--red);
      color: var(--white);
      font-size: 11px;
      font-weight: 700;
      line-height: 18px;
      text-align: center;
      margin-left: 4px;
      vertical-align: middle;
    }

    .cart-badge.is-visible {
      display: inline-block;
    }

    .bottom-nav .cart-badge {
      position: absolute;
      top: -6px;
      right: -12px;
      margin: 0;
    }

    .cart-badge.bump {
      animation: bump .55s cubic-bezier(.3, 1.6, .5, 1);
    }

    /* ============ Page layout ============ */
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 26px 24px 70px;
    }

    .crumbs {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .crumbs a {
      color: var(--muted);
      text-decoration: none;
      transition: color .2s;
    }

    .crumbs a:hover {
      color: var(--red);
    }

    .crumbs i {
      font-size: 10px;
      opacity: .6;
    }

    .crumbs [aria-current] {
      color: var(--text);
      font-weight: 600;
    }

    .product {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
      gap: 52px;
      align-items: start;
    }

    /* ---- Gallery ---- */
    .gallery {
      position: sticky;
      top: 94px;
    }

    .media-frame {
      position: relative;
      aspect-ratio: 1 / 1;
      max-height: max(340px, calc(100vh - 250px)); /* keeps the sticky gallery on-screen on short laptops */
      width: 100%;
      border-radius: 28px;
      overflow: hidden;
      background: var(--surface-2);
      box-shadow: var(--shadow-lg);
      isolation: isolate;
    }

    .media-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .7s cubic-bezier(.2, .8, .2, 1);
      animation: zoomIn .9s cubic-bezier(.2, .8, .2, 1) backwards;
    }

    .media-frame:hover img {
      transform: scale(1.05);
    }

    .media-frame::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 40%;
      background: linear-gradient(to top, rgba(0, 0, 0, .35), transparent);
      pointer-events: none;
    }

    .media-badges {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      z-index: 2;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .pill-red {
      background: var(--red);
      color: var(--white);
      box-shadow: 0 6px 16px rgba(255, 0, 0, .35);
    }

    .pill-yellow {
      background: var(--yellow);
      color: var(--black);
    }

    .pill-green {
      background: var(--white);
      color: #1f8a46;
    }

    .media-actions {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 2;
    }

    .icon-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, .94);
      color: var(--black);
      display: grid;
      place-items: center;
      font-size: 18px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform .2s, color .2s;
    }

    .icon-btn:hover {
      transform: scale(1.08);
      color: var(--red);
    }

    .icon-btn.is-active {
      color: var(--red);
    }

    .icon-btn.is-active i {
      animation: heartPop .45s cubic-bezier(.3, 1.6, .5, 1);
    }




    .perks {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .perks li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 12px;
    }

    .perks i {
      color: var(--red);
      font-size: 18px;
      margin-top: 2px;
    }

    .perks strong {
      display: block;
      font-size: 13px;
      font-weight: 600;
    }

    .perks span {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    /* ---- Info column ---- */
    .cat-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--red-soft);
      color: var(--red);
      font-weight: 600;
      font-size: 13px;
    }

    .title {
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 14px 0 10px;
    }

    .meta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    .meta-row strong {
      color: var(--text);
    }

    .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--border-strong);
    }





    .price-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 12px;
      margin: 20px 0 14px;
    }

    .price {
      font-size: clamp(30px, 3.4vw, 38px);
      font-weight: 800;
      color: var(--red);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }

    .old-price {
      color: var(--muted);
      font-size: 18px;
      font-weight: 500;
    }

    .save {
      align-self: center;
      background: var(--yellow);
      color: var(--black);
      font-weight: 700;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .per-item {
      font-size: 13px;
      color: var(--muted);
    }

    .desc {
      color: var(--text-2);
      line-height: 1.75;
      font-size: 15.5px;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
      gap: 10px;
      margin: 24px 0;
    }

    .fact {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: transform .2s, box-shadow .2s;
    }

    .fact:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .fact>i {
      color: var(--red);
      font-size: 18px;
      margin-bottom: 6px;
    }

    .fact span {
      font-size: 12px;
      color: var(--muted);
    }

    .fact strong {
      font-size: 14px;
      font-weight: 600;
    }

    .spice-meter {
      display: flex;
      gap: 3px;
      margin-top: 4px;
      font-size: 12px;
      color: var(--star-empty);
    }

    .spice-meter .on {
      color: var(--red);
    }

    .notice {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: var(--yellow-soft);
      border: 1px solid rgba(251, 192, 45, .6);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .notice i {
      color: #d39a00;
      margin-top: 3px;
    }

    .block {
      margin-bottom: 24px;
    }

    .block-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .tag {
      margin-left: auto;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .tag-req {
      background: var(--black);
      color: var(--white);
    }

    body.dark .tag-req {
      background: var(--white);
      color: var(--black);
    }

    .tag-opt {
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    /* sizes */
    .sizes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .size-card {
      position: relative;
      cursor: pointer;
      display: block;
    }

    .size-card input,
    .extra-row input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }

    .size-body {
      display: flex;
      flex-direction: column;
      gap: 2px;
      height: 100%;
      padding: 14px 40px 14px 16px;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: var(--surface);
      transition: border-color .2s, background .2s, box-shadow .2s;
    }

    .size-card:hover .size-body {
      border-color: rgba(255, 0, 0, .45);
    }

    .size-card input:checked+.size-body {
      border-color: var(--red);
      background: var(--red-soft);
      box-shadow: 0 8px 20px rgba(255, 0, 0, .12);
    }

    .size-card input:focus-visible+.size-body {
      outline: 3px solid var(--ring);
      outline-offset: 2px;
    }

    .size-name {
      font-weight: 700;
    }

    .size-hint {
      font-size: 12.5px;
      color: var(--muted);
    }

    .size-price {
      font-size: 13px;
      font-weight: 700;
      color: var(--red);
      margin-top: 6px;
    }

    .size-check {
      position: absolute;
      top: 14px;
      right: 14px;
      color: var(--red);
      font-size: 18px;
      opacity: 0;
      transform: scale(.4);
      transition: opacity .2s, transform .25s cubic-bezier(.3, 1.6, .5, 1);
    }

    .size-card input:checked~.size-check {
      opacity: 1;
      transform: scale(1);
    }

    /* extras */
    .extras {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .extra-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }

    .extra-row:hover {
      border-color: rgba(255, 0, 0, .4);
    }

    .extra-row.is-on {
      border-color: var(--red);
      background: var(--red-soft);
    }

    .check {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid var(--border-strong);
      display: grid;
      place-items: center;
      color: var(--white);
      font-size: 11px;
      transition: background .2s, border-color .2s;
    }

    .check i {
      transform: scale(0);
      transition: transform .2s cubic-bezier(.3, 1.6, .5, 1);
    }

    .extra-row input:checked+.check {
      background: var(--red);
      border-color: var(--red);
    }

    .extra-row input:checked+.check i {
      transform: scale(1);
    }

    .extra-row input:focus-visible+.check {
      outline: 3px solid var(--ring);
      outline-offset: 2px;
    }

    .extra-name {
      flex: 1;
      font-size: 14.5px;
      font-weight: 500;
    }

    .extra-price {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
    }

    .extra-row.is-on .extra-price {
      color: var(--red);
    }

    /* ingredients */
    .chips {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chips li {
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 13.5px;
      font-weight: 500;
      transition: border-color .2s, color .2s;
    }

    .chips li:hover {
      border-color: var(--red);
      color: var(--red);
    }

    /* note */
    .note {
      width: 100%;
      min-height: 76px;
      resize: vertical;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 14.5px;
      transition: border-color .2s, box-shadow .2s;
    }

    .note::placeholder {
      color: var(--muted);
    }

    .note:focus {
      outline: none;
      border-color: var(--red);
      box-shadow: 0 0 0 4px var(--ring);
    }

    .counter {
      text-align: right;
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* free-delivery meter */
    .meter {
      background: var(--yellow-soft);
      border: 1px dashed rgba(251, 192, 45, .9);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      transition: background .3s, border-color .3s;
    }

    .meter-text {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      line-height: 1.45;
    }

    .meter-text i {
      color: #d39a00;
      font-size: 16px;
    }

    .meter-track {
      position: relative;
      height: 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .08);
      overflow: hidden;
      margin-top: 10px;
    }

    body.dark .meter-track {
      background: rgba(255, 255, 255, .08);
    }

    .meter-preview,
    .meter-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 0;
      border-radius: inherit;
      transition: width .6s cubic-bezier(.2, .8, .2, 1);
    }

    .meter-preview {
      background: repeating-linear-gradient(45deg, rgba(255, 0, 0, .35) 0 6px, rgba(255, 0, 0, .18) 6px 12px);
    }

    .meter-fill {
      background: linear-gradient(90deg, #ff5252, var(--red));
    }

    .meter.is-unlocked {
      background: rgba(46, 158, 79, .1);
      border-color: rgba(46, 158, 79, .55);
    }

    .meter.is-unlocked .meter-text i {
      color: var(--green);
    }

    .meter.is-unlocked .meter-fill,
    .meter.is-unlocked .meter-preview {
      background: linear-gradient(90deg, #46c46d, var(--green));
    }

    /* buy bar */
    .buy-bar {
      position: sticky;
      bottom: 16px;
      z-index: 20;
      display: flex;
      align-items: stretch;
      gap: 12px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow-md);
    }

    .stepper {
      display: flex;
      align-items: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px;
    }

    .stepper button {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      border: none;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background .15s, color .15s, transform .1s;
    }

    .stepper button:hover:not(:disabled) {
      background: var(--red);
      color: var(--white);
    }

    .stepper button:active:not(:disabled) {
      transform: scale(.92);
    }

    .stepper button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .stepper output {
      min-width: 40px;
      text-align: center;
      font-weight: 800;
      font-size: 17px;
      font-variant-numeric: tabular-nums;
    }

    .btn-primary {
      position: relative;
      overflow: hidden;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 52px;
      padding: 0 8px 0 20px;
      border: none;
      border-radius: 14px;
      background: var(--red-grad);
      color: var(--white);
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(255, 0, 0, .3);
      transition: transform .15s, box-shadow .2s, background .3s;
    }

    .btn-primary::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 40%;
      height: 100%;
      background: linear-gradient(110deg, transparent, rgba(255, 255, 255, .35), transparent);
      transform: skewX(-20deg);
      transition: left .7s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(255, 0, 0, .38);
    }

    .btn-primary:hover::after {
      left: 130%;
    }

    .btn-primary:active {
      transform: scale(.98);
    }

    .btn-primary.is-added {
      background: linear-gradient(120deg, var(--green), #46c46d);
      box-shadow: 0 10px 24px rgba(46, 158, 79, .35);
    }

    .btn-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .btn-total {
      background: rgba(255, 255, 255, .2);
      padding: 8px 12px;
      border-radius: 10px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .btn-ghost {
      padding: 0 20px;
      border-radius: 14px;
      border: 2px solid var(--red);
      background: transparent;
      color: var(--red);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s, color .2s;
    }

    .btn-ghost:hover {
      background: var(--red);
      color: var(--white);
    }

    .btn-ghost:disabled {
      opacity: .7;
      cursor: progress;
    }

    .tick {
      animation: tick .35s ease;
    }

    /* ============ Related ============ */
    .related {
      margin-top: 72px;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .section-head h2 {
      font-size: clamp(20px, 2.4vw, 26px);
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .section-head h2::after {
      content: "";
      display: block;
      width: 44px;
      height: 4px;
      border-radius: 4px;
      background: var(--red-grad);
      margin-top: 6px;
    }

    .section-head a {
      color: var(--red);
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
    }

    .section-head a i {
      transition: transform .2s;
    }

    .section-head a:hover i {
      transform: translateX(4px);
    }

    .rel-track {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: calc((100% - 3 * 18px) / 4);
      gap: 18px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 6px 4px 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }

    .rel-card {
      scroll-snap-align: start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform .25s, box-shadow .25s;
    }

    .rel-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .rel-img {
      position: relative;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: var(--surface-2);
    }

    .rel-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .5s;
    }

    .rel-card:hover .rel-img img {
      transform: scale(1.06);
    }



    .rel-body {
      padding: 12px 14px 14px;
    }

    .rel-body h3 {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rel-cat {
      font-size: 12px;
      color: var(--muted);
      margin: 2px 0 10px;
    }

    .rel-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .rel-foot strong {
      color: var(--red);
      font-size: 16px;
    }

    .rel-add {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: none;
      background: var(--red);
      color: var(--white);
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(255, 0, 0, .3);
      transition: transform .2s;
    }

    .rel-add:hover {
      transform: rotate(90deg) scale(1.05);
    }

    .rel-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--red);
      color: var(--white);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      box-shadow: 0 4px 10px rgba(255, 0, 0, .3);
    }

    .unavailable-chip {
      color: var(--red);
      font-weight: 600;
    }

    .media-frame.is-unavailable img {
      filter: grayscale(.85);
    }

    .btn-primary:disabled {
      background: var(--border-strong);
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary:disabled::after {
      display: none;
    }

    /* ============ Ratings & reviews ============ */
    .tl-stars {
      --pct: 0%;
      display: inline-block;
      font-size: 16px;
      line-height: 1;
      letter-spacing: 2px;
      vertical-align: middle;
    }

    .tl-stars::before {
      content: "★★★★★";
      background: linear-gradient(90deg, var(--yellow) var(--pct), var(--star-empty) var(--pct));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tl-stars.lg {
      font-size: 24px;
    }

    .meta-rating {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
    }

    .meta-rating strong {
      color: var(--text);
    }

    .meta-rating:hover {
      color: var(--red);
    }

    .reviews {
      margin-top: 72px;
      scroll-margin-top: 90px;
    }

    .rv-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
      gap: 18px;
      margin-bottom: 22px;
    }

    .rv-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow-sm);
    }

    .rv-score {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .rv-big {
      font-size: 48px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .rv-total {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .rv-bar {
      display: grid;
      grid-template-columns: 34px 1fr 30px;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
      margin: 6px 0;
    }

    .rv-bar-track {
      height: 8px;
      border-radius: 999px;
      background: var(--surface-2);
      overflow: hidden;
    }

    .rv-bar-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--yellow);
      transition: width .6s cubic-bezier(.2, .8, .2, 1);
    }

    .rv-card h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .rv-note {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .rv-note i {
      color: var(--red);
      margin-right: 6px;
    }

    /* star picker: radios styled as big stars */
    .star-picker {
      display: inline-flex;
      flex-direction: row-reverse;
      gap: 4px;
      margin: 10px 0 4px;
    }

    .star-picker input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }

    .star-picker label {
      font-size: 34px;
      line-height: 1;
      color: var(--star-empty);
      cursor: pointer;
      transition: transform .15s, color .15s;
    }

    .star-picker label:hover,
    .star-picker label:hover~label,
    .star-picker input:checked~label {
      color: var(--yellow);
    }

    .star-picker label:hover {
      transform: scale(1.15);
    }

    .star-picker input:focus-visible+label {
      outline: 3px solid var(--ring);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .star-hint {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      min-height: 18px;
      margin-bottom: 10px;
    }

    .rv-form .note {
      min-height: 90px;
    }

    .rv-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .rv-actions .btn-primary {
      flex: 0 0 auto;
      justify-content: center;
      padding: 0 22px;
      min-height: 46px;
    }

    .rv-actions .btn-ghost {
      min-height: 46px;
    }

    .btn-link {
      background: none;
      border: none;
      color: var(--muted);
      font-weight: 600;
      cursor: pointer;
      padding: 0 8px;
      font-size: 14px;
    }

    .btn-link:hover {
      color: var(--red);
    }

    .rv-list {
      display: grid;
      gap: 14px;
    }

    .rv-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      animation: fadeUp .45s cubic-bezier(.2, .8, .2, 1) backwards;
    }

    .rv-head {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .rv-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--red-soft);
      color: var(--red);
      font-weight: 800;
      flex-shrink: 0;
    }

    .rv-who {
      flex: 1;
      min-width: 0;
    }

    .rv-who strong {
      display: block;
      font-size: 14.5px;
    }

    .rv-meta {
      font-size: 12.5px;
      color: var(--muted);
    }

    .rv-verified {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--green);
      background: rgba(46, 158, 79, .1);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .rv-text {
      margin-top: 10px;
      color: var(--text-2);
      line-height: 1.65;
      font-size: 14.5px;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .rv-empty {
      text-align: center;
      color: var(--muted);
      padding: 26px 10px;
      border: 1px dashed var(--border-strong);
      border-radius: 16px;
    }

    .rv-more {
      display: block;
      margin: 18px auto 0;
      min-height: 46px;
    }

    .rv-hidden-note {
      margin-top: 10px;
      font-size: 13px;
      color: #a87800;
      background: var(--yellow-soft);
      padding: 8px 12px;
      border-radius: 10px;
    }

    @media (max-width: 900px) {
      .rv-grid {
        grid-template-columns: 1fr;
      }

      .reviews {
        margin-top: 48px;
      }
    }

    /* ============ States ============ */
    .skeleton {
      background: linear-gradient(90deg, var(--sk-1) 25%, var(--sk-2) 37%, var(--sk-1) 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
      border-radius: 12px;
    }

    .empty-state {
      text-align: center;
      max-width: 460px;
      margin: 60px auto;
      padding: 40px 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow-md);
    }

    .empty-emoji {
      font-size: 64px;
      margin-bottom: 10px;
      animation: float 3s ease-in-out infinite;
    }

    .empty-state h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .empty-state .btn-primary {
      display: inline-flex;
      justify-content: center;
      padding: 0 28px;
    }

    /* ============ Toast & fly-to-cart ============ */
    .toast {
      position: fixed;
      top: 86px;
      right: 24px;
      z-index: 5000;
      display: flex;
      align-items: center;
      gap: 12px;
      width: min(390px, calc(100vw - 32px));
      padding: 10px 12px 10px 10px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transform: translateY(-16px) scale(.98);
      pointer-events: none;
      transition: opacity .3s, transform .4s cubic-bezier(.2, .9, .3, 1.25);
    }

    .toast.show {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    .toast-media {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      border-radius: 12px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: var(--red-soft);
      color: var(--red);
      font-size: 20px;
    }

    .toast-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .toast-body {
      flex: 1;
      min-width: 0;
    }

    .toast-body strong {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    .toast-body strong i {
      color: var(--green);
    }

    .toast-body span {
      display: block;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast-cta {
      flex-shrink: 0;
      background: var(--red);
      color: var(--white);
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      padding: 9px 12px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .toast-cta[hidden] {
      display: none;
    }

    .toast-close {
      flex-shrink: 0;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
    }

    .fly-img {
      position: fixed;
      z-index: 6000;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--white);
      box-shadow: 0 10px 30px rgba(255, 0, 0, .4);
      pointer-events: none;
    }

    /* ============ Animations ============ */
    .reveal {
      animation: fadeUp .6s cubic-bezier(.2, .8, .2, 1) backwards;
      animation-delay: calc(var(--d, 0) * 70ms);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes zoomIn {
      from {
        opacity: 0;
        transform: scale(1.08);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0 50%;
      }
    }

    @keyframes bump {
      0% {
        transform: scale(1);
      }

      40% {
        transform: scale(1.5);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes heartPop {
      0% {
        transform: scale(1);
      }

      40% {
        transform: scale(1.45);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes tick {
      0% {
        transform: translateY(0);
        opacity: 1;
      }

      45% {
        transform: translateY(-5px);
        opacity: .4;
      }

      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ============ Responsive ============ */
    @media (max-width: 1100px) {
      .header {
        padding: 0 40px;
      }

      .product {
        gap: 36px;
      }

      .perks li {
        flex-direction: column;
        gap: 6px;
      }

      .rel-track {
        grid-auto-columns: calc((100% - 2 * 18px) / 3);
      }
    }

    @media (max-width: 900px) {
      .desktop-nav {
        display: none;
      }

      .hamburger {
        display: block;
      }

      .bottom-nav {
        display: flex;
      }

      .header {
        padding: 0 16px;
      }

      body {
        padding-bottom: 165px;
      }

      .page {
        padding: 14px 16px 24px;
      }

      .crumbs {
        margin-bottom: 14px;
        font-size: 13px;
      }

      .product {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      /* let the gallery's children join the grid so perks can move below the info */
      .gallery {
        display: contents;
      }

      .media-frame {
        order: 1;
        aspect-ratio: 4 / 3;
        max-height: none;
        border-radius: 22px;
      }

      .info {
        order: 2;
      }

      .perks {
        order: 3;
        margin-top: 0;
      }

      .buy-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 65px;
        z-index: 2900;
        border: none;
        border-top: 1px solid var(--border);
        border-radius: 20px 20px 0 0;
        padding: 12px 16px;
        box-shadow: 0 -10px 30px rgba(0, 0, 0, .1);
        animation: slideUp .45s cubic-bezier(.2, .8, .2, 1) both;
      }

      .btn-ghost {
        display: none;
      }

      .related {
        margin-top: 48px;
      }

      .rel-track {
        grid-auto-columns: 42%;
        gap: 14px;
      }

      .toast {
        left: 50%;
        right: auto;
        top: 80px;
        transform: translate(-50%, -16px) scale(.98);
      }

      .toast.show {
        transform: translate(-50%, 0);
      }
    }

    @media (max-width: 600px) {
      .media-frame {
        aspect-ratio: 1 / 1;
        border-radius: 20px;
      }

      .icon-btn {
        width: 42px;
        height: 42px;
        font-size: 16px;
      }

      .facts {
        grid-template-columns: repeat(2, 1fr);
      }

      .perks {
        grid-template-columns: 1fr;
      }

      .perks li {
        flex-direction: row;
        gap: 10px;
      }

      .sizes {
        grid-template-columns: repeat(2, 1fr);
      }

      .size-body {
        padding: 12px 34px 12px 14px;
      }

      .rel-track {
        grid-auto-columns: 64%;
      }

      .stepper button {
        width: 38px;
        height: 38px;
      }

      .stepper output {
        min-width: 34px;
      }

      .btn-primary {
        font-size: 15px;
        padding-left: 16px;
      }
    }

    @media (max-width: 380px) {
      .btn-label i {
        display: none;
      }

      .lbl-long {
        display: none;
